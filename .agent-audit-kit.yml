# AgentAuditKit configuration for FerrumDeck.
#
# Curates the static agent/MCP scan run in CI (.github/workflows/agent-security.yml)
# and locally (`agent-audit-kit scan .`). Suppression is deliberately MINIMAL:
# prefer path-scoped `ignore-paths` (a rule stays live for new code) over global
# `exclude-rules`. Every entry is a triaged false-positive with a rationale.
#
# This was slimmed once AgentAuditKit's own rule-scoping fixes (PRs #477/#478)
# landed: the old broad exclusions for AAK-AGENT-001 / -HOOK-RCE-001 /
# -MCP-STDIO-CMD-INJ-001 / -TASKS-002 / -INDIA-PII-001 / -HEALTHCARE-AI-004/005
# and the litellm-CVE exclusion are all GONE — those rules no longer fire on
# benign patterns here. Real findings were fixed, not suppressed (the litellm and
# mcp-SDK CVEs were resolved by bumping the dependencies). AAK-GHA-IMMUTABLE-001
# (unpinned actions, medium) is intentionally left ON as a visible to-do.

severity: low
fail-on: high # local default; CI passes its own --fail-on

ignore-paths:
  # --- generated / local / gitignored (belt-and-suspenders; CI scans tracked files) ---
  - node_modules/
  - target/
  - .next/
  - .claude-flow/
  - .idea/
  - .env
  - deploy/docker/.env
  - .claude/settings.local.json

  # --- FerrumDeck's OWN secret-detection source ---
  # AAK-SECRET-* matches these files' detection *regex patterns*, not real
  # secrets. Path-scoped so secret detection stays live everywhere else.
  - rust/crates/fd-audit/src/redaction.rs
  - rust/crates/fd-policy/src/airlock/credential_dlp.rs
  - rust/crates/fd-policy/src/airlock/exfiltration.rs
  - rust/services/gateway/src/handlers/training_signal.rs

  # --- injection payloads that are documentation / test fixtures, not live ---
  - CLAUDE.md # a `$(...)` command example in a dev-doc bullet (AGENT-001 / IPI)
  - nextjs/TEST_PLAN.md
  - tests/security/test_input_validation.py

  # --- other confirmed false-positives ---
  - examples/demo/run-demo.sh # `${FD_API_KEY:-fd_dev_...}` seeded local-stack dev key
  # test-runner tool server uses the safe argv pattern (subprocess.run([...]) no
  # shell=True), gated upstream by the deny-by-default allowlist + Airlock.
  - python/packages/fd-mcp-tools/src/fd_mcp_tools/test_runner_server.py

exclude-rules:
  # The only rules still systematically mismatched to this repo (both medium,
  # non-gating; excluded to keep the Security tab focused on real findings).
  - AAK-AGENT-005 # "hidden content in agent instruction file": markdown in dev docs.
  - AAK-TASKS-003 # fires on fd_evals eval-run "tasks" (test/benchmark cases), not
    # credential-bearing or long-lived MCP tasks.

include-user-config: false
