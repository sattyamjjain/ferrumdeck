{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ferrumdeck.secretName" . }}
  labels:
    {{- include "ferrumdeck.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ include "ferrumdeck.databaseUrl" . | quote }}
  redis-url: {{ include "ferrumdeck.redisUrl" . | quote }}
  anthropic-api-key: {{ .Values.secrets.data.anthropicApiKey | quote }}
  openai-api-key: {{ .Values.secrets.data.openaiApiKey | quote }}
{{- end -}}
