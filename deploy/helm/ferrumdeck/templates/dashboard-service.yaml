{{- if .Values.dashboard.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ferrumdeck.fullname" . }}-dashboard
  labels:
    {{- include "ferrumdeck.componentLabels" (dict "component" "dashboard" "Chart" .Chart "Release" .Release "Values" .Values) | nindent 4 }}
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ferrumdeck.componentSelectorLabels" (dict "root" . "component" "dashboard") | nindent 4 }}
{{- end -}}
