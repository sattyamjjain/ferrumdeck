# Default values for ferrumdeck.
# Parity with deploy/k8s/base — production overrides go in your values file.

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Rust gateway (control plane)
# -----------------------------------------------------------------------------
gateway:
  replicaCount: 2
  image:
    repository: ghcr.io/ferrumdeck/gateway
    tag: ""           # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    RUST_LOG: "info"
    GATEWAY_HOST: "0.0.0.0"
    GATEWAY_PORT: "8080"
    RUN_MIGRATIONS: "false"
    OTEL_SERVICE_NAME: "ferrumdeck-gateway"
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

# -----------------------------------------------------------------------------
# Python worker (data plane)
# -----------------------------------------------------------------------------
worker:
  replicaCount: 3
  image:
    repository: ghcr.io/ferrumdeck/worker
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  env:
    OTEL_SERVICE_NAME: "ferrumdeck-worker"
    WORKER_MAX_RETRIES: "3"
    WORKER_RETRY_DELAY_MS: "1000"
    WORKER_CONCURRENCY: "5"
    SANDBOX_MODE: "subprocess"
    PYTHONUNBUFFERED: "1"
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"

# -----------------------------------------------------------------------------
# Next.js dashboard (optional)
# -----------------------------------------------------------------------------
dashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/ferrumdeck/dashboard
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -----------------------------------------------------------------------------
# Shared config (rendered as a ConfigMap)
# -----------------------------------------------------------------------------
config:
  redisQueuePrefix: "fd:queue:"
  controlPlaneUrl: ""               # auto-derived when blank: http://<release>-gateway:<port>
  otelEndpoint: "http://otel-collector:4317"
  defaultModel: "anthropic/claude-sonnet-4-20250514"
  environment: "production"

# -----------------------------------------------------------------------------
# Secrets — for production, set secrets.create=false and reference an
# externally-managed Secret (AWS Secrets Manager / GCP Secret Manager /
# sealed-secrets) via secrets.existingSecret.
# -----------------------------------------------------------------------------
secrets:
  create: true
  existingSecret: ""
  # databaseUrl / redisUrl auto-derived from the bundled deps when blank.
  data:
    databaseUrl: ""
    redisUrl: ""
    anthropicApiKey: ""
    openaiApiKey: ""

# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.ferrumdeck.example.com
      paths:
        - path: /
          pathType: Prefix
          service: gateway
  tls:
    - hosts:
        - api.ferrumdeck.example.com
      secretName: gateway-tls

# -----------------------------------------------------------------------------
# Bundled dependencies — for non-prod or all-in-one demos
# -----------------------------------------------------------------------------
postgresql:
  enabled: true
  # pgvector/pgvector is not a Bitnami image, so we opt in explicitly.
  global:
    security:
      allowInsecureImages: true
  auth:
    username: ferrumdeck
    password: ferrumdeck
    database: ferrumdeck
  image:
    repository: pgvector/pgvector
    tag: pg16
  primary:
    persistence:
      enabled: true
      size: 20Gi

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false

# -----------------------------------------------------------------------------
# Pod-level security defaults — mirror deploy/k8s/base
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

serviceAccount:
  create: true
  annotations: {}
