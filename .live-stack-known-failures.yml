# Declared exemptions for the live-stack suites (tests/security, tests/chaos, tests/e2e).
#
# WHY THIS FILE EXISTS
#   Issue #6: these three suites reported "135 collected, 135 skipped, 0 run".
#   tests/chaos and tests/e2e appeared in no workflow at all, and tests/security
#   ran only inside a `|| true` step with no stack behind it. A suite that never
#   executes looks exactly like a suite that passes.
#
#   The fix is a real gate, not a louder `|| true`. `scripts/check_live_stack_results.py`
#   fails the build when:
#     * fewer than `test_counts.liveness.executed_floor` tests actually EXECUTED
#       (see docs/feature-status.yml -- a ratchet at the observed value, because
#       the regression it guards is silent);
#     * any test failed that is not declared below;
#     * any non-flaky entry below PASSED, so this list cannot quietly become
#       permanent.
#
#   Every entry names a real, reproduced reason. None of them is "this one is
#   annoying". Several are genuine product findings that this branch chose to
#   record rather than silently change -- see docs/compliance/safe-evidence-coverage.md.
#
# HOW TO REMOVE AN ENTRY
#   Fix the underlying issue, delete the line, and the stale-declaration check
#   confirms it. Do not edit the executed floor downward to make a red build green.

# The executed-test floor is NOT here any more. It lives in
# docs/feature-status.yml as `test_counts.liveness.executed_floor`, beside every
# other test count in this repository, so the claims-integrity check owns it and
# the README is held to it. Two homes for one number is a number nobody
# reconciles. `scripts/check_live_stack_results.py` reads it from there.

known_failures:
  # ---------------------------------------------------------------------------
  # Airlock is in SHADOW mode by default: it records violations and does not
  # block them.
  #
  # These entries used to say the anti-RCE layer inspected nothing, which was
  # true until 0.8.12 -- both name-matched layers defaulted to literal tool-name
  # lists that matched nothing a domain-named deployment registers. That is
  # fixed; both now default to inspecting every tool, and the same payload that
  # scored `risk_score: 0` now scores 65 with `violation_type: rcepattern`.
  #
  # The tests still fail, for a different and legitimate reason: with
  # `FERRUMDECK_AIRLOCK_MODE=shadow` (the default, chosen for safety) a detected
  # violation is recorded and the call is still allowed. These cases assert the
  # call is BLOCKED. Whether the shipped default should be `enforce` is a
  # posture decision, not a bug -- and it is a much bigger one than widening a
  # target list, because it changes what a running deployment refuses.
  # ---------------------------------------------------------------------------
  - test: "tests/security/test_audit_trail.py::TestDeniedToolCallIsBlockedAndRecorded::test_denied_tool_call_never_executes_and_is_recorded"
    reason: >-
      The RCE payload IS now detected (risk_score 65, violation_type
      rcepattern, "Shell pipe detected") -- fixed in 0.8.12. It is still
      allowed because Airlock defaults to shadow mode, which records without
      blocking. The test asserts a block. Flipping the default to enforce is a
      posture decision about what a running deployment refuses.
    issue: 6

  - test: "tests/security/test_policy_engine.py::TestDenyByDefault::test_allowlisted_tool_has_no_false_positive_violation"
    reason: >-
      KeyError 'violation_type'. The check-tool response omits the key entirely
      when there is no violation; the test indexes it unconditionally. Response
      shape vs test expectation -- decide which is the contract before changing
      either.
    issue: 6

  - test: "tests/security/test_airlock.py::TestRcePatternsDetected::test_rce_payload_is_flagged[pickle]"
    reason: >-
      Pattern-coverage gap: the pickle deserialization payload is not matched by
      the built-in anti-RCE pattern set. The other parametrized cases in this
      class pass, so the layer works -- this specific pattern is missing.
    issue: 6

  - test: "tests/security/test_input_validation.py::TestCommandInjectionDetected::test_command_injection_is_flagged[newline]"
    reason: >-
      Pattern-coverage gap: newline-separated command injection is not matched.
      Sibling parametrized cases pass.
    issue: 6

  # ---------------------------------------------------------------------------
  # Input validation reaching the database
  # ---------------------------------------------------------------------------
  - test: "tests/security/test_policy_engine.py::TestPolicyBypassAttempt::test_crafted_tool_name_is_denied[git_read\\x00execute_shell]"
    reason: >-
      A NUL byte in the tool name reaches Postgres and returns 500
      ("invalid byte sequence for encoding UTF8: 0x00", SQLSTATE 22021) instead
      of a clean deny. A bypass attempt should be refused, not crash the
      handler. Real input-validation defect.
    issue: 6

  # ---------------------------------------------------------------------------
  # Test-side defects (the gateway behaves correctly)
  # ---------------------------------------------------------------------------
  - test: "tests/security/test_authentication.py::TestInvalidKeyBlocked::test_empty_bearer_token"
    reason: >-
      httpx refuses to send the header client-side
      (LocalProtocolError: Illegal header value b'Bearer '), so the request
      never reaches the gateway. The test must construct the empty-credential
      case differently; it is not exercising the server today.
    issue: 6

  - test: "tests/security/test_authentication.py::TestWriteOnlyEndpoint::test_write_only_endpoint"
    reason: >-
      Asserts 200 from an endpoint the gateway does not serve (404). Either the
      route was never built or the test targets the wrong path.
    issue: 6

  - test: "tests/security/test_authentication.py::TestBruteForceProtection::test_rate_limit_recovery"
    reason: >-
      Depends on the rate-limit window and on how many requests earlier tests in
      the session already spent, so it passes or fails depending on ordering.
      Needs an isolated limiter or a dedicated key before it can gate anything.
    flaky: true
    issue: 6

  # ---------------------------------------------------------------------------
  # Chaos: needs container control the CI job does not grant
  # ---------------------------------------------------------------------------
  - test: "tests/chaos/test_recovery.py::TestPolicyDecisionSurvivesRecovery::test_decision_is_identical_before_and_after_postgres_recovery"
    reason: >-
      Stops and restarts the Postgres container by name
      (POSTGRES_CONTAINER, default ferrumdeck-postgres-1). Under GitHub Actions
      `services:` the container is not named that and is not stoppable from the
      job, so the fault is never injected. Genuinely needs a compose-based stack
      to run; keeping it declared rather than deleted so the gap stays visible.
    issue: 6

  # ---------------------------------------------------------------------------
  # E2E run + agent scenarios: outcome depends on whether a worker is executing
  # steps, which differs by environment. CI runs no worker (and no
  # ANTHROPIC_API_KEY), so a created run never advances; a local `make dev-up`
  # brings a worker up, so some of these pass there. All are marked `flaky`,
  # which exempts them from the stale-declaration check only -- they may still
  # never fail undeclared. The honest fix is a worker in the job, at which point
  # these stop being environment-dependent and the `flaky` markers come off.
  # ---------------------------------------------------------------------------
  - test: "tests/e2e/test_agent_runs.py::TestCreateAndCompleteRun::test_create_and_complete_run"
    reason: "Waits for a created run to reach a terminal state; needs a worker executing steps."
    flaky: true
    issue: 6
  - test: "tests/e2e/test_agent_runs.py::TestRunWithApproval::test_run_with_approval"
    reason: "Drives a run to an approval gate through the worker; needs a worker executing steps."
    flaky: true
    issue: 6
  - test: "tests/e2e/test_agent_runs.py::TestRunWithToolCalls::test_run_with_tool_calls"
    reason: "Needs a worker to dispatch the tool call the assertion inspects."
    flaky: true
    issue: 6
  - test: "tests/e2e/test_agent_runs.py::TestRunTimeout::test_run_timeout"
    reason: >-
      Waits for a run to reach a terminal state within a timeout. Passes in CI
      (the run never starts, so the timeout assertion holds vacuously) and fails
      against a local stack with a worker -- which is itself a sign the test
      asserts the wrong thing and wants rewriting.
    flaky: true
    issue: 6
  - test: "tests/e2e/test_agent_scenarios.py::TestSafePRAgentReadRepo::test_agent_read_repo"
    reason: "Full agent scenario; needs a worker executing LLM steps end to end."
    flaky: true
    issue: 6
  - test: "tests/e2e/test_agent_scenarios.py::TestSafePRAgentPropose::test_agent_propose_changes"
    reason: "Full agent scenario; needs a worker executing LLM steps end to end."
    flaky: true
    issue: 6
  - test: "tests/e2e/test_agent_scenarios.py::TestSafePRAgentApproval::test_agent_approval_for_write"
    reason: "Drives the write path to an approval gate; needs a worker executing LLM steps."
    flaky: true
    issue: 6
  - test: "tests/e2e/test_agent_scenarios.py::TestAgentErrorRecovery::test_agent_retry_on_failure"
    reason: "Full agent scenario; needs a worker executing LLM steps end to end."
    flaky: true
    issue: 6
  - test: "tests/e2e/test_agent_scenarios.py::TestAgentContextPassing::test_context_passed_between_steps"
    reason: "Full agent scenario; needs a worker executing LLM steps end to end."
    flaky: true
    issue: 6
  - test: "tests/e2e/test_agent_scenarios.py::TestAgentLoopDetection::test_agent_loop_detection"
    reason: "Full agent scenario; needs a worker executing LLM steps end to end."
    flaky: true
    issue: 6
