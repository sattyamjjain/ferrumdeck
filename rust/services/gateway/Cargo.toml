[package]
name = "gateway"
# A binary service, not a library. Never published.
publish = false
description = "FerrumDeck API Gateway service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
# Workspace crates
fd-core = { path = "../../crates/fd-core", package = "ferrumdeck-core" }
fd-storage = { path = "../../crates/fd-storage" }
fd-policy = { path = "../../crates/fd-policy", package = "ferrumdeck-policy" }
fd-registry = { path = "../../crates/fd-registry" }
fd-audit = { path = "../../crates/fd-audit", package = "ferrumdeck-audit" }
fd-otel = { path = "../../crates/fd-otel", package = "ferrumdeck-otel" }
fd-dag = { path = "../../crates/fd-dag", package = "ferrumdeck-dag" }

# Async runtime
tokio = { workspace = true }
# SSE: BroadcastStream adapts the realtime bus's broadcast receiver into the
# Stream axum::response::sse::Sse requires. Already in the lock file via tokio's
# own dependents, so this adds no new supply-chain surface.
tokio-stream = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Validation
validator = { workspace = true }

# OpenAPI documentation
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

# Database
sqlx = { workspace = true }

# Redis
redis = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Configuration
dotenvy = { workspace = true }

# Tracing
tracing = { workspace = true }

# IDs
ulid = { workspace = true }
uuid = { workspace = true }

# Time
chrono = { workspace = true }

# Crypto
sha2 = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }

# HTTP client (for JWKS fetching)
reqwest = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
