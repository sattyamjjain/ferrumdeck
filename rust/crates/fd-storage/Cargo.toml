[package]
name = "fd-storage"
description = "FerrumDeck storage layer: PostgreSQL repositories and migrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fd-core = { path = "../fd-core", package = "ferrumdeck-core" }
# Audit hash-chain: the canonical record encoding + verifier live in fd-audit
# (pure, no DB); this repo computes record_hash at insert and verifies on read.
fd-audit = { path = "../fd-audit", package = "ferrumdeck-audit" }

# Database
sqlx = { workspace = true }

# Redis
redis = { workspace = true }

# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# IDs
ulid = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Decimal precision
rust_decimal = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Tracing
tracing = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
# Path-only dev-dep (stripped from any published manifest) for the
# permission-reconstruction integration test, which needs the typed
# PolicyDocument to prove the stored JSON round-trips. fd-storage deliberately
# does NOT depend on fd-policy at build time -- persistence stays independent
# of the policy crate; only the test asserts across the boundary.
fd-policy = { path = "../fd-policy", package = "ferrumdeck-policy" }
# Path-only dev-dep (stripped from any published manifest) for the end-to-end
# test that an extracted W3C trace-id lands on the persisted decision record.
fd-otel = { path = "../fd-otel" }
serde_json = { workspace = true }
