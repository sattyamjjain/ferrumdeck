[package]
name = "ferrumdeck-policy"
description = "FerrumDeck enforcement engine: deny-by-default tool allowlists, Airlock RASP, the R1-R3 reversibility ladder, budgets, and an EU AI Act Art.50 transparency rule"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/sattyamjjain/ferrumdeck"
keywords = ["agent", "security", "policy", "enforcement", "mcp"]
categories = ["development-tools"]
readme = "README.md"

# Published as `ferrumdeck-policy`; the Rust import path stays `fd_policy`.
[lib]
name = "fd_policy"

[dependencies]
fd-core = { path = "../fd-core", version = "0.8.17", package = "ferrumdeck-core" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Tracing
tracing = { workspace = true }

# Airlock dependencies
regex = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
jsonschema = { version = "0.17", default-features = false }

# Deterministic decimal math (budget forecasting)
rust_decimal = { workspace = true }

# Timestamp on bench-audit summaries (workspace-managed; serde feature on).
chrono = { workspace = true }

# Content-addressed hashing for routing-decision audit records — see
# fd_policy::routing.
sha2 = { workspace = true }
hex = { workspace = true }

# Ed25519 verification of AP2 payment-mandate signature chains — see
# fd_policy::ap2. Verify-only usage; deterministic, no I/O.
ed25519-dalek = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
criterion = { version = "0.5", features = ["html_reports"] }
# Path-only dev-deps (stripped from the published manifest) for the end-to-end
# test that the Colorado ADMT decision's disclosure flag reaches the OTel span.
fd-otel = { path = "../fd-otel", package = "ferrumdeck-otel" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[[bench]]
name = "enforcement_latency"
harness = false
