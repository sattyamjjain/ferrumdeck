[package]
name = "fd-policy"
description = "FerrumDeck policy engine: allowlists, budgets, approvals, Airlock security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fd-core = { path = "../fd-core" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Tracing
tracing = { workspace = true }

# Airlock dependencies
regex = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
jsonschema = { version = "0.17", default-features = false }

# Deterministic decimal math (budget forecasting)
rust_decimal = { workspace = true }

# Timestamp on bench-audit summaries (workspace-managed; serde feature on).
chrono = { workspace = true }

# Content-addressed hashing for routing-decision audit records — see
# fd_policy::routing.
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
