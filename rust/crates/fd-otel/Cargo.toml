[package]
name = "ferrumdeck-otel"
description = "FerrumDeck OpenTelemetry helpers: GenAI semantic conventions, enforcement-decision spans, and cost/firing-rate attributes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/sattyamjjain/ferrumdeck"
keywords = ["opentelemetry", "genai", "tracing", "agent", "otel"]
categories = ["development-tools::debugging"]
readme = "README.md"

# Published as `ferrumdeck-otel`; the Rust import path stays `fd_otel`.
[lib]
name = "fd_otel"

[dependencies]
# Tracks the workspace version, and `scripts/bump_version.py` rewrites it on
# every bump -- do not hand-edit. This pin previously read `^0.8.9` on the
# reasoning that a published crate must name a requirement the registry can
# satisfy, which was true when core had not been re-published. It stopped being
# true at 0.8.13, and the literal stayed. That is the failure mode the bump
# script now owns; see `internal_pins_track_workspace_version`.
fd-core = { path = "../fd-core", version = "0.8.17", package = "ferrumdeck-core" }

# OpenTelemetry
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
