[package]
name = "ferrumdeck-dag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "DAG scheduler for workflow orchestration in FerrumDeck: dependency resolution, cycle detection, and topological execution order"
license.workspace = true
repository.workspace = true
homepage = "https://github.com/sattyamjjain/ferrumdeck"
keywords = ["dag", "scheduler", "workflow", "orchestration", "agent"]
categories = ["development-tools"]
readme = "README.md"

# Published as `ferrumdeck-dag`; the Rust import path stays `fd_dag`.
[lib]
name = "fd_dag"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
