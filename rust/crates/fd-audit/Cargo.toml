[package]
name = "ferrumdeck-audit"
description = "FerrumDeck audit trail: append-only event log, a per-tenant SHA-256 hash-chain, and signed out-of-band chain-head checkpoints (tamper-evidence up to the last checkpoint)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/sattyamjjain/ferrumdeck"
keywords = ["agent", "audit", "tamper-evidence", "hash-chain", "compliance"]
categories = ["development-tools"]
readme = "README.md"

# Published as `ferrumdeck-audit`; the Rust import path stays `fd_audit`.
[lib]
name = "fd_audit"

[dependencies]
fd-core = { path = "../fd-core", version = "0.8.16", package = "ferrumdeck-core" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Hash-chain tamper-evidence (SHA-256 over a canonical record encoding).
# sha2 + hex are already workspace deps (fd-storage uses them for API-key
# hashing); reused here rather than adding a new crate.
sha2 = { workspace = true }
hex = { workspace = true }

# Ed25519 signatures for the out-of-band chain-head checkpoints (#14). Already a
# workspace dep (fd-policy verifies AP2 mandates with it); reused here. The
# checkpoint signing key is deliberately NOT the database's, so a DB-privileged
# actor cannot forge a checkpoint. Construction is from-bytes only (operator
# supplies key material) so this pulls in no RNG dependency.
ed25519-dalek = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Tracing
tracing = { workspace = true }

# Regex for sensitive data detection
regex = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
# Integration tests construct deterministic ids for the golden-fixture
# regression — see tests/audit_record_schema_drift.rs.
ulid = { workspace = true }
