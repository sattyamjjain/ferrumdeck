[project]
name = "fd-cli"
version = "0.8.17"
# Workspace-internal, not a PyPI distribution. Rejects an accidental `twine
# upload`; install from source (uv sync), not `pip install fd-cli`.
classifiers = ["Private :: Do Not Upload"]
description = "FerrumDeck CLI - Command line tool for interacting with the control plane"
requires-python = ">=3.12"
dependencies = [
    "fd-runtime",
    "typer>=0.9",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.scripts]
fd = "fd_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fd_cli"]

[tool.uv.sources]
fd-runtime = { workspace = true }
