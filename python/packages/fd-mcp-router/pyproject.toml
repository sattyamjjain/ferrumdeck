[project]
name = "fd-mcp-router"
version = "0.8.17"
# Workspace-internal, not a PyPI distribution. Rejects an accidental `twine
# upload`; install from source (uv sync), not `pip install fd-mcp-router`.
classifiers = ["Private :: Do Not Upload"]
description = "FerrumDeck MCP tool router - deny-by-default tool execution"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "mcp>=1.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fd_mcp_router"]
