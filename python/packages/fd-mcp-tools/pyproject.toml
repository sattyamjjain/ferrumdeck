[project]
name = "fd-mcp-tools"
version = "0.8.19"
# Workspace-internal, not a PyPI distribution. Rejects an accidental `twine
# upload`; install from source (uv sync), not `pip install fd-mcp-tools`.
classifiers = ["Private :: Do Not Upload"]
description = "FerrumDeck MCP Tool Servers - Git and Test Runner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.1",
]

# For GitHub operations, use the official GitHub MCP server:
# https://github.com/github/github-mcp-server
# Install via: npx -y @anthropic-ai/github-mcp-server

[project.scripts]
fd-mcp-git = "fd_mcp_tools.git_server:main"
fd-mcp-test-runner = "fd_mcp_tools.test_runner_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fd_mcp_tools"]
