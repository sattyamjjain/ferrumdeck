[project]
name = "fd-runtime"
version = "0.8.1"
# Workspace-internal, not a PyPI distribution. This classifier makes an
# accidental `twine upload` fail (PyPI rejects "Private :: Do Not Upload"), so
# nobody can assume `pip install fd-runtime` works — install from source (uv sync).
classifiers = ["Private :: Do Not Upload"]
description = "FerrumDeck agent runtime primitives"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.28",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fd_runtime"]
