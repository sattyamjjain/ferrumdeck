# Single source of truth for claims integrity.
#
# The README "Key Features" list and the "Project Status & Limitations" section
# (mirrored into ROADMAP.md) used to be able to drift — a feature advertised as
# shipped in one place while the other said it was not wired. This file is the
# one place that records, per feature the Limitations section contradicts, the
# exact inline status marker that MUST appear on its Key Features row.
#
# `scripts/check_claims_integrity.py` (run in CI + `make check-claims`) fails if:
#   * a Key Features row named here is missing its marker, or
#   * ROADMAP.md no longer references a contradicted feature, or
#   * the README test-count block disagrees with `test_counts` below, or
#   * (with --recount) the re-derived test counts disagree with `test_counts`.
#
# Every status here was verified against the code on 2026-07-30 (paths cited).

# ---------------------------------------------------------------------------
# Key Features rows that the Limitations section contradicts. Each `readme_row`
# is a stable substring identifying the Key Features bullet; `marker` is the
# exact inline text that bullet must contain.
# ---------------------------------------------------------------------------
key_features:
  - id: audit-tamper-evidence
    readme_row: "**Audit Trail**:"
    marker: "tamper-evident up to the last signed checkpoint; not tamper-proof"
    status: "append-only (app API + DB trigger) + per-tenant SHA-256 hash-chain + signed out-of-band head checkpoints; detectable up to the last checkpoint, not tamper-proof"
    evidence: >-
      Migration db/migrations/20260801000001_add_audit_hash_chain.sql adds
      prev_hash/record_hash/chain_seq; rust/crates/fd-audit/src/chain.rs computes
      a per-record SHA-256 over a canonical encoding chained to its predecessor,
      and AuditRepo::create links each row in one FOR UPDATE transaction (plus the
      existing append-only trigger trg_audit_events_append_only). AuditRepo::verify_chain
      detects any insertion/deletion/edit within a tenant's chain (proven by
      rust/crates/fd-audit/tests/hash_chain.rs). rust/crates/fd-audit/src/checkpoint.rs
      then anchors the head out-of-band: CheckpointSigner signs
      (tenant_id, chain_seq, record_hash, checkpointed_at) with an Ed25519 key that
      is NOT the database's, FileCheckpointSink appends it (CheckpointSink trait),
      and verify_against_checkpoints / AuditRepo::verify_against_checkpoints catch a
      wholesale self-consistent tail rewrite up to the most recent checkpoint
      (proven by rust/crates/fd-audit/tests/checkpoint_anchor.rs — the load-bearing
      whole_tail_rewrite_after_checkpoint_is_detected). RESIDUAL: detection not
      prevention — records after the last checkpoint keep only the in-chain
      guarantee, a missing checkpoint degrades to it, and the anchor is only as
      strong as an out-of-band sink + off-host key. Not tamper-proof (issue #14).
    limitations_anchor: "#project-status--limitations"
    roadmap_issue: 14

  - id: realtime-sse
    readme_row: "**Realtime run stream (SSE)**"
    marker: "[all five run-channel events push; the replay buffer is per-process"
    status: "gateway→BFF push live for all five run-channel events, each published only after its backing record commits; replay is per-process"
    evidence: >-
      The gateway serves GET /v1/events/{channel}
      (rust/services/gateway/src/handlers/events.rs) and publishes
      policy.response.recorded from check_tool_policy -- specifically from
      inside the fire-and-forget audit write, after the row commits, so the
      record_id it carries resolves via GET /v1/audit/{event_id}. Verified on a
      live stack: a denied call produced decision "Deny", rule null (nothing
      matched; deny-by-default refused it), latency_ms 20, and a record_id that
      read back as policy.denied at chain_seq 870.
      nextjs/src/app/api/sse/[channel]/route.ts proxies that stream and emits
      stream.degraded when the gateway is unreachable. Reconnect honours
      Last-Event-ID and ?last_event_id=; a gap outside the bounded in-process
      replay buffer emits stream.gap naming the range rather than looking quiet.
      Covered by tests/security/test_realtime_decisions.py (6, live-stack) and 4
      DB-backed Rust tests asserting the row is readable when the event arrives,
      that a denial publishes exactly once, and that a failed write publishes
      nothing.
      As of 0.8.14 the other four push too (#47): run.forecast.updated after an
      awaited update_forecast returns Ok (its record is the run row, so it
      carries forecast_at rather than a record_id), and
      policy.decision.explained / routing.decision.recorded /
      coherence.divergence.detected from inside their audit writes.
      policy.decision.explained required PERSISTING the DecisionTrace first --
      it was computed, returned over HTTP and discarded, so nothing it described
      could be read back.
      The console applies forecast and coherence to the cached run via
      useRunChannel; useRun still polls because status, cost, tokens and step
      progress have no push behind them, and the poll is what recovers state a
      stream.gap swallowed.
      LIMITS, both accepted with reasoning recorded on #47: the replay buffer is
      per-process, so a reconnect landing on another replica of a multi-replica
      gateway cannot be served completely (it emits stream.gap rather than
      looking quiet); and every SSE connection counts against
      RATE_LIMIT_PER_MINUTE -- one token per connect, not per event, with a
      correct Retry-After on the 429.
      NOT verified live: coherence.divergence.detected needs a multi-step
      trajectory and routing.decision.recorded needs a workflow run the dev seed
      cannot satisfy. Both have DB-backed ordering tests.
    limitations_anchor: "#project-status--limitations"
    roadmap_issue: 47

  - id: eval-framework-dashboard
    readme_row: "**Evaluation Framework**:"
    marker: "[read + dispatch live; no eval executor consumes the queue"
    status: "eval read and dispatch both backed by a durable store; no executor runs a dispatched suite, so it stays pending"
    evidence: >-
      GET /api/v1/evals/suites serves the real on-disk suite definitions
      (evals/suites/*.yaml, with real task counts from the datasets) via
      nextjs/src/lib/evals/suite-loader.ts. /runs and /regression-report now
      proxy the gateway eval-read backend (rust/services/gateway/src/handlers/
      evals.rs), with /runs mapped onto the dashboard EvalRun contract by
      nextjs/src/lib/evals/run-mapper.ts; each returns 501 when no report store
      is reachable and never an empty 200. Two defects fixed together: the
      gateway parsed only the <suite>-<YYYYMMDD> naming, silently dropping every
      eval_<suite>_<ts>.json safe-PR report, and the BFF proxied gateway field
      names verbatim so the runs table rendered blanks.
      VERIFIED ON A LIVE STACK (0.8.13): GET /v1/evals/runs served 36 runs from
      evals/reports, and the newest matched its file field for field --
      eval_smoke_20260824_030710 with started_at 2026-08-24T03:07:10.966639+00:00,
      average_score 1.0, assertion_coverage 1.0, harness run_id eval_ad440ecd64fd.
      Every figure now carries measured_at { at, precision, source }: precision
      "second" from the report body for the LLM suites, "day" from the file name
      for asb/governed-benchmark, which record no timestamp. mtime is never used
      -- on a fresh clone it would report the checkout as the measurement.
      /v1/evals/suites and /v1/evals/suites/{id} serve per-suite measured
      history; 404 there means the store was read and holds no run for that
      suite, which is distinct from 501 NO_EVAL_STORE meaning no store was
      reachable. The BFF suite-detail route joins that with the on-disk
      definition and reports history_available:false rather than an empty runs
      list when the gateway cannot be asked.
      0.8.14 (#46) moved the store into Postgres (`eval_runs`), with
      evals/reports/*.json as its IMPORT SOURCE rather than a parallel query
      surface -- one queryable place for committed reports and dispatched runs,
      keyed by the report file stem so ingest is idempotent.
      POST /v1/evals/runs persists a run and enqueues it, answering 202 Accepted.
      NOT 201, and this is the honest part: no eval executor consumes the queue,
      so a dispatched run stays `pending` with queued_at set and started_at null,
      and reports `unclaimed: true`. It is durable and queryable; it is not
      running, and nothing claims it is.
      mapGatewayRun no longer hardcodes status "completed" -- it reads the real
      value and falls back to `pending`, never `completed`, because an
      unrecognized status must not be reported as finished.
      An empty store still returns 501 rather than an empty 200: eval_ingests
      records that an ingest happened, which is what keeps "we looked and found
      none" distinct from "we never looked" now that the store is a database the
      gateway cannot start without.
    limitations_anchor: "#project-status--limitations"
    roadmap_issue: 46

  - id: regression-gating
    readme_row: "**Regression Gating**:"
    marker: "[PR gate covers the 3 deterministic suites; LLM-judged suite stays nightly"
    status: "3 deterministic governance suites gate every PR; LLM-judged suite is nightly"
    evidence: >-
      .github/workflows/ci.yml has an `eval-regression` job (push + pull_request,
      no services, no secrets) that runs `make eval-injection-defense`,
      `make eval-asb`, `make bench-governed`, and `cargo test -p
      ferrumdeck-policy --test injection_defense --test asb_defense --test
      governed_benchmark --test ap2_gate` — so a golden-fixture or real-engine-pin
      regression blocks a PR merge. The LLM-judged smoke/regression suite
      (needs model calls + a live stack) still runs nightly in
      .github/workflows/evals.yml, not on PRs.
    limitations_anchor: "#project-status--limitations"
    roadmap_issue: 46

  - id: baseline-comparisons
    readme_row: "**Baseline Comparisons**:"
    marker: "[read + dispatch live; no eval executor consumes the queue"
    status: "baseline view reads the eval store; dispatch persists but no executor runs it"
    evidence: >-
      Same path as eval-framework-dashboard: /api/v1/evals/* serves the
      gateway's real on-disk reports, and the round-trip was confirmed against a
      live stack in 0.8.13. Each regression entry now carries from_measured_at
      and to_measured_at, so a reader can tell an overnight regression from one
      spanning seven weeks -- a delta is a claim about two instants and was
      previously shown without either.
    limitations_anchor: "#project-status--limitations"
    roadmap_issue: 46

  - id: bff-trust-boundary
    readme_row: "**Trust boundary"
    marker: "the dashboard BFF performs no caller authentication"
    status: "dashboard BFF does no caller auth; proxies with one shared FD_API_KEY"
    evidence: >-
      nextjs/src/lib/api/config.ts getAuthHeaders() attaches a single shared
      FD_API_KEY; there is no nextjs/src/middleware.ts and route handlers such as
      nextjs/src/app/api/v1/runs/route.ts proxy to the gateway without inspecting
      the incoming caller, so reaching the dashboard port grants FD_API_KEY
      authority (including POST /v1/runs). Per-caller auth (dashboard session +
      SSO/RBAC + API-key self-service) is issue #10.
    limitations_anchor: "#trust-boundary"
    roadmap_issue: 10

# ---------------------------------------------------------------------------
# Bound claims: a figure that is misleading on its own.
#
# `key_features` above binds a marker to a single README bullet. This binds a
# marker set to a WHOLE DOCUMENT: if `claim` appears anywhere in a file listed
# under `applies_to`, every string in `markers` must appear in that same file.
# The point is that a reader cannot meet the number without also meeting the
# caveat that decides how much it is worth.
#
# Enforced by `check_bound_claims` in scripts/check_claims_integrity.py
# (run in CI + `make check-claims`).
# ---------------------------------------------------------------------------
bound_claims:
  - id: coherence-fp-provenance
    claim: "10.42%"
    markers:
      - "real: n=0"
      - "synthetic_grounded: 6.77%"
      - "synthetic_authored: 25.00%"
    applies_to:
      - README.md
      - ROADMAP.md
      - docs/benchmarks/enforce-vs-observe.md
    rationale: >-
      10.42% reads as one property of the monitor. It is three, and they do not
      agree: 6.77% (13/192) on trajectories whose text is drawn from real
      repository sources, 25.00% (12/48) on hand-authored ones, and NOTHING at
      all on trajectories captured from a real agent run -- that class is n=0.
      The headline is therefore a weighted average over a corpus mix this
      repository chose (docs/reports/coherence-fp-2026-09.md, "What this corpus
      is"), not an estimate of what a deployed agent would meet. Quoting the
      pooled figure without `real: n=0` states a measured operational cost that
      has never been measured against real traffic, which is the specific
      overstatement issue #57 was opened about.
    evidence: >-
      Per-provenance table in docs/reports/coherence-fp-2026-09.md, generated by
      `fd_evals.coherence_negatives --data-report` from the committed corpus
      (evals/datasets/coherence-negatives/, seed 20260902, frozen vocabulary)
      and staleness-gated by `make docs-coherence-fp-check`. The `real` row is
      printed at n=0 rather than omitted, on the reasoning that a missing row
      reads as an oversight and a zero reads as a fact.
    exempt:
      - path: CHANGELOG.md
        reason: >-
          Append-only release history. Entries record what was true at the time
          they were written; retrofitting a caveat into shipped entries would be
          rewriting the record this file exists to protect.
      - path: evals/reports/coherence_fp-20260902.md
        reason: >-
          Machine-written artifact of a single run, reproduced byte-for-byte by
          `make eval-coherence-fp`. Hand-editing it would make the run
          irreproducible.
      - path: docs/reports/coherence-fp-2026-09.md
        reason: >-
          This IS the per-provenance breakdown, and it is generated. Requiring
          the summary markers inside the document that produces them would make
          `make docs-coherence-fp-check` and `make check-claims` contradict each
          other on every regeneration.
    issue: 57

# ---------------------------------------------------------------------------
# Test counts, re-derived programmatically on 2026-07-30. The README test-count
# block must render the `gating_total` and the liveness caveat from this. Run
# `make claims-recount` (scripts/check_claims_integrity.py --recount) to
# re-derive after tests change; CI verifies README <-> this file agreement, and
# cheaply re-derives the Python-collectable buckets.
# ---------------------------------------------------------------------------
test_counts:
  # Suites that gate CI (unit/lint) — the honest headline.
  gating:
    rust:
      count: 829
      method: "cargo test --workspace -- --list | grep -cE ': test$'"
    python_unit:
      count: 553
      method: "uv run pytest python/packages/{fd-runtime,fd-mcp-router,fd-worker,fd-evals}/tests --collect-only -q"
    frontend:
      count: 681
      method: "cd nextjs && npm test -- --watchAll=false --ci  (jest 'Tests:' total)"
    api_contracts:
      count: 50
      method: "uv run pytest tests/api --collect-only -q"
  gating_total: 2113
  # Live-stack suites: require `make dev-up`, skip without it, and (per the
  # README testing caveat) assert liveness more than behaviour. NOT counted in
  # the headline, reported on their own line.
  liveness:
    # 78 -> 84: the six tests/security/test_realtime_decisions.py cases added in
    # 0.8.13 were never counted here. Collected counts drift silently because
    # nothing derives them; `make claims-recount` re-reads them.
    security: 84
    chaos: 14
    e2e: 43
    integration: 81
    method: "uv run pytest tests/<suite> --collect-only -q (skip at runtime without a live gateway)"
    note: "excluded from the headline; assert liveness more than behaviour (security/chaos/e2e)"

    # ---------------------------------------------------------------------
    # THE NUMBER THAT ACTUALLY MATTERS.
    #
    # Everything above is COLLECTED. Collected is what pytest found; it says
    # nothing about whether a single assertion ran. Until 0.8.9 these three
    # suites reported 135 collected / 135 SKIPPED / 0 executed, and the CI
    # check was green the whole time, because a skipped test and a passing
    # test are indistinguishable in a green check.
    #
    # `executed_floor` is the floor on collected-minus-skipped in the
    # `live-stack-tests` CI job. `scripts/check_live_stack_results.py` reads
    # it FROM HERE, so the claims-integrity check owns this number like every
    # other count on this page and there is exactly one place to change it.
    #
    # 102 is what executes today against a fresh database, observed stable
    # across consecutive runs. That makes this a ratchet at the current value,
    # not the slack cliff-detector it started as: a drop of even one test fails
    # the build. That is deliberate -- the regression being guarded is silent,
    # so the guard has to be tight. If a test starts skipping for a GOOD
    # reason, re-baseline consciously (drop the entry from
    # .live-stack-known-failures.yml if it is a declared failure, then lower
    # this number in the same commit that explains why). Never lower it to
    # turn a red build green.
    #
    # 80 -> 102 (0.8.15, issue #6). Twenty cases were skipping on
    # `pytest.skip("Could not create workflow")`, and the cause was not the
    # stack: every workflow-creating fixture used a FIXED name, and
    # `POST /v1/workflows` rejects a duplicate with 400. So the first test to
    # use a fixture ran and every later one skipped -- and on a database that
    # had ever run the suite before, even the first one skipped.
    #
    # Taking those skips out surfaced a real defect underneath:
    # `POST /v1/workflow-runs` wrote the caller's TENANT id into the run's
    # `project_id` foreign key, so the endpoint had never once created a run.
    # Nine e2e cases had been skipping past it. That is issue #6's thesis
    # stated as precisely as it can be: a suite that never executes looks
    # exactly like a suite that passes.
    # ---------------------------------------------------------------------
    executed_floor: 102
    executed_floor_method: "scripts/check_live_stack_results.py --junit live-stack-results.xml  (executed = collected - skipped, measured in the live-stack-tests job)"
