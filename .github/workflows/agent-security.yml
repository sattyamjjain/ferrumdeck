name: Agent Security Scan (AgentAuditKit)

# Static (shift-left) security scan of FerrumDeck's own MCP / agent configs —
# the SAST companion to the runtime Airlock enforcement plane. AgentAuditKit
# scans `.claude/`, `config/mcp-config.json`, `examples/safe-pr-agent/`,
# `evals/agents/`, etc. for misconfigurations, tool poisoning, trust-boundary
# gaps, and hardcoded secrets, and uploads SARIF to the Security tab.
#
# POSTURE: gating. The build FAILS on any high/critical finding (`fail-on: high`).
# The pre-existing false-positive backlog has been triaged and suppressed in the
# committed `.agent-audit-kit.yml` at the repo root — every suppression there is a
# documented false-positive (dev-doc shell listings, our own secret-detection
# source, trusted-config MCP stdio, React-hook keyword collisions, eval "tasks",
# local/gitignored files) or a fixed finding (the litellm CVE). Real findings are
# NOT suppressed: AAK-GHA-IMMUTABLE-001 (unpinned actions, medium) stays visible
# in the Security tab as a to-do. A NEW high/critical finding will block CI.
# SARIF (all severities) is still uploaded to the Security tab regardless of the
# gate outcome, so findings below the gate threshold remain visible.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write # upload SARIF to the Security / Code Scanning tab
  pull-requests: write # sticky PR comment summarising findings

concurrency:
  group: agent-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-audit:
    name: AgentAuditKit MCP scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SHA-pinned to AgentAuditKit v0.3.52 — dogfoods the scanner's own
      # AAK-GHA-IMMUTABLE-001 rule (pin third-party actions to an immutable
      # commit SHA, not a mutable tag). Update the SHA + comment together.
      #
      # The Docker action generates the SARIF file into the workspace but is not
      # passed a token to authenticate a Code Scanning upload, so `upload-sarif`
      # is left false and the SARIF is uploaded explicitly in the next step via
      # GitHub's own codeql-action (the reliable, token-authenticated path).
      - name: Scan agent + MCP configs
        uses: sattyamjjain/agent-audit-kit@fb60194a91d1328027abdd48b033d9a67563b501 # v0.3.52
        with:
          path: .
          severity: low # SARIF carries all severities for the Security tab...
          fail-on: high # ...but the build only fails on high/critical.
          format: sarif
          upload-sarif: false # uploaded explicitly below (the action gets no token)
          comment-on-pr: true
          # Suppression (ignore-paths + exclude-rules) lives in the committed
          # .agent-audit-kit.yml so it is reviewable and reused by local scans.
          config: .agent-audit-kit.yml

      # Normalize the SARIF before upload. AAK v0.3.52 emits SARIF `fixes[]`
      # objects carrying only a free-text `description` and NOT the
      # SARIF-2.1.0-required `artifactChanges` property, so GitHub's uploader
      # rejects the whole file. `fixes` is optional and is meant for
      # machine-applicable patches, not remediation prose — stripping it yields
      # valid SARIF with every finding, location, and rule preserved.
      # (Upstream bug to fix in agent-audit-kit's SARIF emitter.)
      - name: Normalize SARIF (strip malformed optional fixes)
        if: always()
        run: |
          if [ -f agent-audit-results.sarif ]; then
            jq 'del(.runs[]?.results[]?.fixes)' agent-audit-results.sarif > agent-audit-results.clean.sarif
            echo "normalized: $(jq '.runs[0].results | length' agent-audit-results.clean.sarif) results, 0 fixes"
          else
            echo "::error::scan did not produce agent-audit-results.sarif"; exit 1
          fi

      # Upload to the Security / Code Scanning tab. This step is NOT report-only:
      # a broken upload SHOULD fail visibly (a green run with no findings in the
      # Security tab is worse than a red one telling you the pipe is broken).
      - name: Upload SARIF to Code Scanning
        if: always() # run even though the scan step is continue-on-error
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: agent-audit-results.clean.sarif
          category: agent-audit-kit
