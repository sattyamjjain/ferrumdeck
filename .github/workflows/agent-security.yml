name: Agent Security Scan (AgentAuditKit)

# Static (shift-left) security scan of FerrumDeck's own MCP / agent configs —
# the SAST companion to the runtime Airlock enforcement plane. AgentAuditKit
# scans `.claude/`, `config/mcp-config.json`, `examples/safe-pr-agent/`,
# `evals/agents/`, etc. for misconfigurations, tool poisoning, trust-boundary
# gaps, and hardcoded secrets, and uploads SARIF to the Security tab.
#
# POSTURE: gating. The build FAILS on any high/critical finding (`fail-on: high`).
# The pre-existing false-positive backlog has been triaged and suppressed in the
# committed `.agent-audit-kit.yml` at the repo root — every suppression there is a
# documented false-positive (dev-doc shell listings, our own secret-detection
# source, trusted-config MCP stdio, React-hook keyword collisions, eval "tasks",
# local/gitignored files) or a fixed finding (the litellm CVE). Real findings are
# NOT suppressed: AAK-GHA-IMMUTABLE-001 (unpinned actions, medium) stays visible
# in the Security tab as a to-do. A NEW high/critical finding will block CI.
# SARIF (all severities) is still uploaded to the Security tab regardless of the
# gate outcome, so findings below the gate threshold remain visible.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write # upload SARIF to the Security / Code Scanning tab
  pull-requests: write # sticky PR comment summarising findings

concurrency:
  group: agent-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-audit:
    name: AgentAuditKit MCP scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SHA-pinned to AgentAuditKit main @ d781ae9 (includes PRs #477/#478: the
      # SARIF `artifactChanges` fix, the resolved-version lockfile pin parser, and
      # the P2 rule-scoping precision). Bump to a tagged release SHA once one is
      # cut (currently main is ahead of the v0.3.52 tag). Pinning by full SHA
      # dogfoods the scanner's own AAK-GHA-IMMUTABLE-001 rule.
      #
      # The Docker action only emits the SARIF (it is not passed a token to
      # authenticate a Code Scanning upload), so `upload-sarif` is false and the
      # SARIF is uploaded explicitly below via GitHub's own codeql-action — the
      # path AgentAuditKit's own README now documents.
      - name: Scan agent + MCP configs
        uses: sattyamjjain/agent-audit-kit@d781ae92a9b2311ec8316afebe024150c4ad5ff6 # main (>= v0.3.55, #477+#478)
        with:
          path: .
          severity: low # SARIF carries all severities for the Security tab...
          fail-on: high # ...but the build only fails on high/critical.
          format: sarif
          upload-sarif: false # uploaded explicitly below (the action gets no token)
          comment-on-pr: true
          # Suppression (ignore-paths + exclude-rules) lives in the committed
          # .agent-audit-kit.yml so it is reviewable and reused by local scans.
          config: .agent-audit-kit.yml

      # Upload to the Security / Code Scanning tab. NOT best-effort: a broken
      # upload SHOULD fail visibly (a green run with an empty Security tab is
      # worse than a red one telling you the pipe is broken). The SARIF is valid
      # as emitted now that AAK's `artifactChanges` bug is fixed (#477), so no
      # normalization step is needed.
      - name: Upload SARIF to Code Scanning
        if: always() # run even if the scan step fails the gate on findings
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: agent-audit-results.sarif
          category: agent-audit-kit
