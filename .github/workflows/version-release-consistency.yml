name: Version & Release Consistency

# Two drift guards, added after the release history fell three versions behind the
# tags and the root Python version sat at 0.1.0 against a 0.7.11 workspace:
#
#   1. version-parity   — the Rust workspace version and the root Python version
#                         must agree (unless an explicit opt-out marker is present).
#   2. tag-has-release  — every `v*.*.*` git tag must have a matching GitHub Release.
#
# Runs on pushes/PRs to main (so drift is caught before it compounds), on a weekly
# schedule (so an un-released tag can't sit unnoticed), and on demand.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-parity:
    name: All manifests match the Rust workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare every version-bearing manifest to the Rust workspace version
        run: |
          set -euo pipefail

          # Explicit opt-out: create the marker file to intentionally decouple the
          # version-bearing manifests from the Rust workspace version.
          if [ -f .version-parity-optout ]; then
            echo "::notice::.version-parity-optout present — skipping version parity check."
            exit 0
          fi

          # Root Cargo.toml [workspace.package].version is the single source of truth;
          # every manifest below must match it, and no Rust crate may pin a literal
          # version (they must inherit via version.workspace = true). tomllib/json
          # are stdlib — no new CI dependency.
          python3 - <<'PY'
          import glob, json, tomllib, sys, pathlib

          truth = tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version']
          print(f"Source of truth — Cargo.toml [workspace.package].version = {truth}\n")
          problems = []

          def check(label, got):
              ok = got == truth
              print(f"  {'OK ' if ok else 'BAD'}  {label}: {got}")
              if not ok:
                  problems.append(f"{label} = {got!r} (expected {truth!r})")

          def project_version(path):
              return tomllib.load(open(path, 'rb'))['project']['version']

          # Python manifests: root + every workspace package.
          check('pyproject.toml [project].version', project_version('pyproject.toml'))
          for p in sorted(glob.glob('python/packages/*/pyproject.toml')):
              check(f'{p} [project].version', project_version(p))

          # Root package __version__ (split on '=' to avoid regex quoting).
          root_v = None
          for line in pathlib.Path('src/ferrumdeck/__init__.py').read_text().splitlines():
              if line.strip().startswith('__version__'):
                  root_v = line.split('=', 1)[1].strip().strip('"').strip("'")
                  break
          check('src/ferrumdeck/__init__.py __version__', root_v)

          # Node dashboard.
          check('nextjs/package.json .version', json.load(open('nextjs/package.json')).get('version'))

          # Every Rust crate/service must INHERIT its version (version.workspace = true),
          # never pin a literal — this assertion is what stops a future crate
          # re-introducing the fd-dag bug. A literal parses as str; inheritance parses
          # as {'workspace': True}.
          pinned = []
          for path in sorted(glob.glob('rust/crates/*/Cargo.toml') + glob.glob('rust/services/*/Cargo.toml')):
              v = tomllib.load(open(path, 'rb')).get('package', {}).get('version')
              if isinstance(v, str):
                  pinned.append(f'{path} pins version = "{v}" (use version.workspace = true)')
          if pinned:
              print('  BAD  rust manifests pinning a literal [package].version:')
              for pp in pinned:
                  print('       - ' + pp)
              problems.extend(pinned)
          else:
              print('  OK   no rust crate/service pins a literal [package].version')

          if problems:
              print()
              for pr in problems:
                  print(f'::error::version drift: {pr}')
              sys.exit(1)
          print(f'\nAll version-bearing manifests agree at {truth}; no rust crate pins a literal version.')
          PY

  tag-has-release:
    name: Every tag has a GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the full tag history

      - name: Check tags against releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tags="$(git tag --list 'v*.*.*' | sort -u)"
          if [ -z "$tags" ]; then
            echo "No v*.*.* tags — nothing to check."
            exit 0
          fi

          releases="$(gh release list --limit 200 --json tagName -q '.[].tagName' | sort -u)"

          missing=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if ! grep -Fxq "$tag" <<<"$releases"; then
              missing="$missing $tag"
            fi
          done <<<"$tags"

          if [ -n "$missing" ]; then
            echo "::error::These tags have no GitHub Release:$missing — create them (gh release create <tag> --notes-file ...) so the release history matches the tags."
            exit 1
          fi
          echo "Every v*.*.* tag has a matching GitHub Release."

  repo-description-consistency:
    name: GitHub description matches .github/repo-metadata.yml
    # The GitHub "About" description is a deployed setting, not part of the PR
    # diff, and CI cannot write it without a PAT. So this runs at release time
    # (push to main / schedule / dispatch), NOT on pull_request — on a PR it
    # would always fail until an operator syncs the setting by hand. It exists
    # because the description once said "production-grade" while the README said
    # early-stage; this fails loudly if they ever diverge again.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compare the live GitHub description to the pinned source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Pinned value (single-line double-quoted scalar → sed, no YAML dep).
          pinned="$(sed -n 's/^description: *"\(.*\)"$/\1/p' .github/repo-metadata.yml)"
          if [ -z "$pinned" ]; then
            echo "::error::Could not read description from .github/repo-metadata.yml"
            exit 1
          fi

          # Live GitHub "About" description, whitespace-normalised for comparison.
          live="$(gh repo view "${{ github.repository }}" --json description -q '.description // ""' \
            | tr '\n' ' ' | tr -s ' ' | sed 's/^ *//; s/ *$//')"
          pinned_norm="$(printf '%s' "$pinned" | tr '\n' ' ' | tr -s ' ' | sed 's/^ *//; s/ *$//')"

          echo "pinned: $pinned_norm"
          echo "live:   $live"

          if [ "$pinned_norm" != "$live" ]; then
            echo "::error::The GitHub repo description has drifted from .github/repo-metadata.yml. Paste the exact string printed below into GitHub → the repo → About (gear) → Description. This guards against the repo advertising a maturity claim the README contradicts."
            echo "----- paste this into GitHub → About → Description -----"
            printf '%s\n' "$pinned"
            echo "-------------------------------------------------------"
            exit 1
          fi
          echo "The GitHub description matches the pinned source."

  umbrella-not-behind-deps:
    name: Published ferrumdeck is not behind any crate it re-exports
    # The `ferrumdeck` umbrella re-exports the enforcement engine (ferrumdeck-policy)
    # and, via the optional `audit` feature, ferrumdeck-audit. The release fails if the
    # published umbrella trails EITHER crate, or if it advertises the `audit` feature
    # while ferrumdeck-audit is unpublished — in every one of those cases
    # `cargo add ferrumdeck [--features audit]` resolves to stale bits or fails to
    # resolve at all. This is a crates.io state check, not a repo-diff check, so it runs
    # at release time (push to main / schedule / dispatch), not on PRs. Expected red
    # until the umbrella + audit crate are published at parity with policy (#22).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Compare published umbrella against every crate it re-exports
        run: |
          set -euo pipefail
          fetch() {
            curl -s "https://crates.io/api/v1/crates/$1" -H "User-Agent: ferrumdeck-ci" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('crate',{}).get('max_version',''))"
          }
          # `sort -V` puts the lower SemVer first; used to test "$1 < $2".
          lower() { printf '%s\n%s\n' "$1" "$2" | sort -V | head -1; }

          umbrella="$(fetch ferrumdeck)"
          if [ -z "$umbrella" ]; then
            echo "::error::could not fetch the published ferrumdeck version from crates.io"
            exit 1
          fi
          echo "published ferrumdeck (umbrella) = $umbrella"
          problems=0

          # ferrumdeck-policy — always re-exported. The umbrella must be >= it.
          policy="$(fetch ferrumdeck-policy)"
          echo "published ferrumdeck-policy = ${policy:-<none>}"
          if [ -z "$policy" ]; then
            echo "::error::ferrumdeck-policy is not published, yet the umbrella re-exports it."
            problems=1
          elif [ "$umbrella" != "$policy" ] && [ "$(lower "$umbrella" "$policy")" = "$umbrella" ]; then
            echo "::error::published ferrumdeck ($umbrella) trails ferrumdeck-policy ($policy): 'cargo add ferrumdeck' gets an engine older than the policy crate. Publish the umbrella at >= $policy."
            problems=1
          fi

          # ferrumdeck-audit — re-exported via the optional `audit` feature. Because the
          # umbrella ADVERTISES that feature, the audit crate must exist and must not be
          # ahead of the umbrella, or `cargo add ferrumdeck --features audit` breaks.
          audit="$(fetch ferrumdeck-audit)"
          echo "published ferrumdeck-audit = ${audit:-<none>}"
          if [ -z "$audit" ]; then
            echo "::error::the umbrella advertises an 'audit' feature but ferrumdeck-audit is not published (name unclaimed): 'cargo add ferrumdeck --features audit' cannot resolve. Publish ferrumdeck-audit (#22)."
            problems=1
          elif [ "$umbrella" != "$audit" ] && [ "$(lower "$umbrella" "$audit")" = "$umbrella" ]; then
            echo "::error::published ferrumdeck ($umbrella) trails ferrumdeck-audit ($audit): the 'audit' feature exposes a version the umbrella is behind. Publish the umbrella at >= $audit."
            problems=1
          fi

          if [ "$problems" -ne 0 ]; then
            echo "::error::published ferrumdeck is behind a crate it re-exports, or that crate is unpublished. Publish in dependency order — core -> policy -> audit -> umbrella — all at the current workspace version. Expected red until that publish happens (#22)."
            exit 1
          fi
          echo "OK: published ferrumdeck ($umbrella) is not behind ferrumdeck-policy ($policy) or ferrumdeck-audit ($audit)."
