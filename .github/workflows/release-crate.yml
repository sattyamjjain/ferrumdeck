name: Release Crate

# Publishes the FerrumDeck enforcement engine to crates.io on a version tag.
# Requires a `CARGO_REGISTRY_TOKEN` repository secret (a crates.io API token for
# an account that owns — or will claim on first publish — the `ferrumdeck-core`,
# `ferrumdeck-otel`, `ferrumdeck-policy`, `ferrumdeck-audit`, and `ferrumdeck`
# crate names).
# `workflow_dispatch` lets you run it manually after adding the secret, without
# cutting a new tag.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Gates. Scoped to the published crates (they have no DB/sqlx dependency),
      # so this job stays self-contained; the full workspace test with Postgres
      # runs in ci.yml on the merge commit.
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (published crates)
        run: cargo clippy -p ferrumdeck-core -p ferrumdeck-otel -p ferrumdeck-policy -p ferrumdeck-audit -p ferrumdeck --all-targets -- -D warnings

      - name: Test (published crates)
        run: cargo test -p ferrumdeck-core -p ferrumdeck-otel -p ferrumdeck-policy -p ferrumdeck-audit -p ferrumdeck

      # Provenance for conformity / audit reviewers: cargo-auditable embeds the
      # dependency SBOM into a compiled binary. The published crates are source
      # libraries (no binary in the crates.io tarball), so we build the umbrella's
      # `enforce` example under cargo-auditable to produce an SBOM-embedded,
      # audit-reviewable artifact (`cargo audit bin`). Downstream consumers get the
      # same SBOM embedding when they build their own binary against ferrumdeck.
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked

      - name: Build SBOM-embedded provenance artifact
        run: cargo auditable build --release -p ferrumdeck --example enforce

      - name: Upload provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferrumdeck-enforce-auditable
          path: target/release/examples/enforce
          if-no-files-found: warn

      # Publish in dependency order: core -> policy -> audit -> umbrella. `cargo
      # publish` waits for each crate to appear in the index before returning, so
      # the next crate can resolve the one just published. The umbrella depends on
      # ferrumdeck-audit through its optional `audit` feature, so audit MUST be on
      # crates.io before the umbrella publishes — otherwise `cargo publish -p
      # ferrumdeck` cannot resolve `ferrumdeck-audit` and the release half-lands
      # (core + policy published, audit + umbrella not). This step is what makes a
      # `v*.*.*` tag publish all four crates instead of failing at the umbrella.
      - name: Publish ferrumdeck-core
        run: cargo publish -p ferrumdeck-core --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      # ferrumdeck-otel was omitted from this list until 0.8.17 and drifted five
      # patch releases behind (0.8.12 while the workspace was at 0.8.17). Nothing
      # published depends on it at build time -- it is a path-only dev-dependency
      # of fd-policy and fd-storage, and a real dependency only of the unpublished
      # gateway -- so the gap broke no downstream build. It did make the crate a
      # false claim surface: `cargo add ferrumdeck-otel` handed a stranger 0.8.12
      # while the docs described 0.8.17 behaviour. It publishes after core, which
      # is its only workspace dependency.
      - name: Publish ferrumdeck-otel
        run: cargo publish -p ferrumdeck-otel --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Publish ferrumdeck-policy
        run: cargo publish -p ferrumdeck-policy --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Publish ferrumdeck-audit
        run: cargo publish -p ferrumdeck-audit --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Publish ferrumdeck (umbrella)
        run: cargo publish -p ferrumdeck --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
