name: Docs

# Render the MkDocs site from docs/ and publish it to GitHub Pages on every push to
# main that touches the docs. `mkdocs gh-deploy` builds the site and force-pushes it to
# the gh-pages branch using the built-in GITHUB_TOKEN — no PAT needed. Pages is now
# ENABLED (Settings -> Pages -> Deploy from a branch -> gh-pages / (root), enabled
# 2026-08-09), so the site serves at https://sattyamjjain.github.io/ferrumdeck/ .
# That URL is canaried by .github/workflows/docs-link-liveness.yml, which fails if
# it ever stops returning 200 (e.g. if Pages is disabled again).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# gh-deploy pushes the built site to the gh-pages branch of this repo.
permissions:
  contents: write

# Never let two deploys race the gh-pages branch.
concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gh-deploy updates the gh-pages branch; needs history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs + Material
        run: pip install "mkdocs-material>=9.5,<10"

      - name: Build & deploy to gh-pages
        run: mkdocs gh-deploy --force --no-history
