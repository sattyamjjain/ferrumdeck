name: Demo Quickstart

# Proves the Docker-only quickstart still works, so it cannot silently rot: it
# runs examples/demo/run-demo.sh against the PUBLISHED GHCR images and commits the
# dated transcript to examples/demo/TRANSCRIPT.md (CI-generated, never hand-pasted).
#
# It pulls anonymously (no GHCR login) on purpose — that is exactly the path a
# stranger takes, so if the packages ever go private the canary turns red. Expect
# red until the images are published (a v*.*.* tag) AND made public.
on:
  schedule:
    - cron: "37 5 * * 1" # Mondays 05:37 UTC
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed transcript back to the branch

concurrency:
  group: demo-quickstart
  cancel-in-progress: true

jobs:
  demo:
    name: Run the published-image demo + refresh transcript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot the published stack + run the demo (anonymous pull)
        id: demo
        env:
          COMPOSE_FILE: deploy/docker/compose.demo.yaml
          # Optional: only the end-to-end agent path (Part B) uses it; Part A is
          # deterministic and needs no key.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          cp .env.example .env
          # No `docker login ghcr.io` — pull as an anonymous stranger would.
          if ./examples/demo/run-demo.sh 2>&1 | tee /tmp/demo-raw.txt; then
            echo "demo_ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "demo_ok=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh transcript (only on a passing run)
        if: steps.demo.outputs.demo_ok == '1'
        run: |
          {
            echo "# Demo transcript (CI-generated)"
            echo ""
            echo "Generated by \`.github/workflows/demo-quickstart.yml\` on $(date -u +%Y-%m-%dT%H:%M:%SZ),"
            echo "running \`examples/demo/run-demo.sh\` against the published GHCR images"
            echo "(\`deploy/docker/compose.demo.yaml\`). Not hand-written."
            echo ""
            echo '```'
            # Strip ANSI colour codes for a clean committed transcript.
            sed -r 's/\x1b\[[0-9;]*m//g' /tmp/demo-raw.txt
            echo '```'
          } > examples/demo/TRANSCRIPT.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/demo/TRANSCRIPT.md
          if git diff --cached --quiet; then
            echo "Transcript unchanged — nothing to commit."
          else
            git commit -m "docs(demo): refresh CI transcript $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Teardown
        if: always()
        run: docker compose -f deploy/docker/compose.demo.yaml down -v || true

      - name: Fail if the demo did not pass
        if: steps.demo.outputs.demo_ok != '1'
        run: |
          echo "::error title=Quickstart is broken::run-demo.sh failed against the published images. The packages may be private/unpublished, an image may be stale, or the demo regressed. Transcript left unchanged; last 40 lines below."
          tail -40 /tmp/demo-raw.txt || true
          exit 1
