name: Evaluations

# This workflow runs the NIGHTLY, LLM-judged evaluation suite (the smoke /
# regression / all suites, which need model calls and a live stack). The
# DETERMINISTIC governance suites — injection-defense, ASB, and
# governed-vs-ungoverned, plus the real `fd_policy` engine pins — are gated on
# every push + PR by the `eval-regression` job in ci.yml (no services, no
# secrets), so a fixture/pin regression blocks a merge without waiting for the
# nightly run. Keep that split: fast + deterministic on PRs here-in-ci, slow +
# LLM-judged on a schedule here. See ROADMAP #7.
on:
  schedule:
    # Nightly: the 3-task smoke suite.
    - cron: '0 2 * * *'
    # Weekly (Sunday): the full 20-task regression suite. Nothing scheduled it
    # before, so `regression` sat at NEVER RUN on docs/eval-health.md while the
    # project claimed eval gating. Verified on run 31897644086 before being
    # wired here: 20/20 passed, average score 1.00, $0.0047 -- so this is a
    # suite known to pass, not a red job scheduled on hope.
    - cron: '0 3 * * 0'

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      suite:
        description: 'Evaluation suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - all

      runs:
        description: 'Number of runs per task (for consistency check)'
        required: false
        default: '1'
        type: string

      parallel:
        description: 'Number of parallel workers'
        required: false
        default: '2'
        type: string

      min_score:
        description: 'Fail if the average score drops below this floor (harness-wiring guard)'
        required: false
        default: '0.01'
        type: string

env:
  CARGO_TERM_COLOR: always

# Least privilege: read the repo, and open/refresh a single tracking issue when a
# scheduled run fails, so a red cron is never silent (the failure that cost three
# days to diagnose). No write access to repo contents.
permissions:
  # contents: write so the nightly can commit the regenerated eval-health page.
  contents: write
  issues: write

jobs:
  eval:
    name: Run Evaluations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ferrumdeck
          POSTGRES_PASSWORD: ferrumdeck
          POSTGRES_DB: ferrumdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Preflight — required secrets
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            {
              echo "## ❌ ANTHROPIC_API_KEY is not set — cannot run the LLM-judged evals"
              echo ""
              echo "This is a **configuration** problem, not a code bug. Set the secret at"
              echo "**Settings → Secrets and variables → Actions → ANTHROPIC_API_KEY**."
              echo "A tracking issue is opened/updated by this run on a scheduled failure."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error title=Missing ANTHROPIC_API_KEY::Config issue, not code — set the ANTHROPIC_API_KEY repo secret."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY is present."

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build gateway
        run: cargo build --package gateway --release

      - name: Start gateway
        env:
          DATABASE_URL: postgres://ferrumdeck:ferrumdeck@localhost:5432/ferrumdeck
          REDIS_URL: redis://localhost:6379
          GATEWAY_PORT: 8080
          RUST_LOG: info
          # The eval harness drives the gateway hard: parallel workers poll run +
          # step status once a second (DEFAULT_POLL_INTERVAL=1.0s) on a single
          # tenant, which blows past the default 100/min per-tenant limit and 429s
          # (the 401 auth bug had masked this — no request ever reached the
          # limiter). CI gets a generous limit, exactly as compose.dev raises it for
          # dev; production keeps the defaults.
          RATE_LIMIT_PER_MINUTE: "100000"
          PRE_AUTH_RATE_LIMIT_PER_MINUTE: "10000"
        run: |
          ./target/release/gateway &
          sleep 5
          curl -f http://localhost:8080/health

      - name: Start worker
        env:
          FD_CONTROL_PLANE_URL: http://localhost:8080
          REDIS_URL: redis://localhost:6379
          # The worker reports step results back to the gateway and must
          # authenticate; without FD_API_KEY it logs "cannot report results to
          # control plane" and the run never completes. Seeded dev key.
          FD_API_KEY: fd_dev_key_abc123
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run python -m fd_worker &
          sleep 3

      - name: Run evaluations
        id: run_evals
        env:
          FD_CONTROL_PLANE_URL: http://localhost:8080
          # ROOT CAUSE of the nightly going red: the runner sends
          # `Authorization: Bearer $FD_API_KEY` only when FD_API_KEY is set
          # (fd_evals/runner.py). Unset, it sent no header and the gateway 401'd
          # POST /v1/runs with "Missing Authorization header". This seeded dev key
          # is accepted (legacy-hash deadline is 2027-01-01, not passed).
          FD_API_KEY: fd_dev_key_abc123
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          # Two crons share this job. github.event.schedule names which one
          # fired, so the Sunday cron runs the full regression suite and the
          # nightly stays on smoke. A manual dispatch always wins.
          if [ -n "${{ inputs.suite }}" ]; then
            SUITE="${{ inputs.suite }}"
          elif [ "${{ github.event.schedule }}" = "0 3 * * 0" ]; then
            SUITE="regression"
          else
            SUITE="smoke"
          fi
          RUNS="${{ inputs.runs || '1' }}"
          PARALLEL="${{ inputs.parallel || '2' }}"
          # regression is 20 tasks; give it more workers when it is the weekly run.
          if [ "$SUITE" = "regression" ] && [ -z "${{ inputs.parallel }}" ]; then
            PARALLEL=4
          fi
          # Export the suite so the failure-explainer step can name it.
          echo "EVAL_SUITE=$SUITE" >> "$GITHUB_ENV"

          echo "Running eval suite: $SUITE  (runs=$RUNS, parallel=$PARALLEL)"
          mkdir -p evals/reports
          # Tee the whole run to a log so a failure still leaves an artifact that
          # names which case broke (pipefail keeps the eval's exit code).
          # --min-score is the harness-wiring regression guard. The safe-PR eval
          # scored exactly 0.12 on every task for forty consecutive nightlies
          # because three of its four scorers read run-context fields the control
          # plane never populated (#31). A floor breach exits 2 and means the
          # harness stopped observing what it asserts on -- not that the agent
          # got worse.
          uv run python -m fd_evals run \
            --suite "$SUITE" \
            --runs "$RUNS" \
            --parallel "$PARALLEL" \
            --min-score "${{ inputs.min_score || '0.01' }}" \
            --output "evals/reports/eval_${SUITE}_$(date +%Y%m%d_%H%M%S).json" \
            2>&1 | tee "evals/reports/eval-output-${SUITE}.log"

      - name: Explain failure (which suite + which case)
        if: failure() && steps.run_evals.conclusion == 'failure'
        run: |
          log="evals/reports/eval-output-${EVAL_SUITE:-smoke}.log"
          {
            echo "## ❌ Nightly eval run failed"
            echo ""
            echo "**Suite:** \`${EVAL_SUITE:-unknown}\`"
            echo ""
            if [ -f "$log" ]; then
              echo "**Failing cases / first errors:**"
              echo '```'
              grep -E "Task .* failed:|ControlPlaneError|UNAUTHORIZED|Missing Authorization|[0-9]{3} (Unauthorized|Forbidden)|Traceback|Error:" "$log" | head -30 || echo "(no per-case failure lines captured)"
              echo '```'
              echo ""
              echo "Full output + any partial report are in the **eval-reports-${{ github.run_number }}** artifact."
            else
              echo "The run failed before producing eval output (see the step logs above)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate summary
        run: |
          python3 << 'EOF'
          import json
          import os
          from pathlib import Path

          reports_dir = Path("evals/reports")
          latest = sorted(reports_dir.glob("eval_*.json"))[-1] if reports_dir.exists() else None

          if not latest:
              print("No eval reports found")
              exit(0)

          with open(latest) as f:
              report = json.load(f)

          total = report.get('total_tasks', 0)
          passed = report.get('passed_tasks', 0)
          failed = total - passed
          duration = report.get('duration_seconds', 0)

          summary = f"""
          ## Evaluation Results

          | Metric | Value |
          |--------|-------|
          | Suite | {report.get('suite', 'unknown')} |
          | Total Tasks | {total} |
          | Passed | {passed} |
          | Failed | {failed} |
          | Pass Rate | {100*passed/total:.1f}% |
          | Duration | {duration:.1f}s |

          """

          # Write to GitHub summary
          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
              f.write(summary)

          print(summary)
          EOF

      # Runs even when the eval failed: a red nightly is exactly when the
      # health page needs to say so. The page is generated from the committed
      # report files, never hand-written.
      # The three headline benchmarks are deterministic and offline -- seeded,
      # no LLM, no network -- and ci.yml already runs them on every push and
      # pull request. What was missing was committing their reports: between
      # 2026-08-10 and 2026-08-26 exactly two landed, so docs/eval-health.md
      # reported "2 consecutive passes" for evals that had run hundreds of
      # times. The evidence was stale, not the eval.
      #
      # Weekly rather than nightly. They are deterministic, so a nightly run
      # commits three byte-identical files under a new date every night --- noise
      # in the history for no added evidence. Weekly gives a 7-day cadence
      # against the 14-day staleness limit: a full missed week of margin before
      # the gate fires.
      - name: Re-run the offline headline benchmarks (weekly)
        if: always() && github.event.schedule == '0 3 * * 0'
        run: make eval-injection-defense && make eval-asb && make bench-governed

      - name: Stage this run's report BEFORE regenerating the page
        if: always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Order matters, and getting it wrong cost a run of lag on every
          # nightly. gen_eval_health.py reads `git ls-files` (the 0.8.7 fix that
          # stopped the page being built from whatever was on the author's disk).
          # `git ls-files` reads the INDEX, so a report that is merely written to
          # disk is invisible to it -- but a staged one is not.
          #
          # Regenerating first therefore built the page from N-1 reports and then
          # committed the Nth alongside it, so the published page described the
          # previous night's run forever. The 2026-08-18 nightly committed a smoke
          # report at 100% assertion coverage next to a page still reporting 50%.
          # Nothing caught it because that commit carries [skip ci].
          #
          # `eval_*.json` is un-ignored in .gitignore, so a plain add is enough --
          # no -f, which means a dropped report shows up as an ordinary
          # uncommitted change instead of vanishing silently.
          git add evals/reports/eval_*.json 2>/dev/null || true
          # The benchmark reports are un-ignored now (see .gitignore), so a plain
          # add is enough. They previously needed `git add -f`, which is exactly
          # why they stopped being committed.
          git add evals/reports/asb-*.json evals/reports/asb-*.md \
                  evals/reports/injection_defense-*.json evals/reports/injection_defense-*.md \
                  evals/reports/governed-benchmark-*.json evals/reports/governed-benchmark-*.md \
                  2>/dev/null || true

      - name: Regenerate eval-health page and fail on stale evidence
        if: always()
        # --release turns a STALE row into a build failure. Without it the page
        # would faithfully render the problem and nothing would break, which is
        # the shape of every gap this file has already closed: `regression` sat
        # at NEVER RUN for months while the page said so.
        #
        # The page is written even when the gate fails, so a failing nightly
        # still publishes an accurate page rather than leaving the last green
        # one in place.
        run: uv run python scripts/gen_eval_health.py --release

      - name: Commit eval-health page
        if: always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/reports/eval_*.json 2>/dev/null || true
          git add docs/eval-health.md
          if git diff --cached --quiet; then
            echo "Eval health unchanged — nothing to commit."
          else
            git commit -m "docs(evals): refresh eval health $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-${{ github.run_number }}
          path: |
            evals/reports/
            docs/eval-health.md
          retention-days: 90

      - name: Open/refresh tracking issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly eval workflow is failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The scheduled \`Evaluations\` workflow failed ($(date -u +%Y-%m-%dT%H:%MZ)). Run: ${run_url}

          The eval report and full output are attached as the \`eval-reports-${{ github.run_number }}\` artifact, and the run summary names the failing suite/case. If the preflight flagged a missing ANTHROPIC_API_KEY this is a config issue (set the secret); otherwise it is a code/stack failure to investigate."
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" && echo "Refreshed tracking issue #${existing}"
          else
            gh issue create --title "$title" --body "$body" \
              && echo "Opened tracking issue" \
              || echo "::warning::could not open tracking issue (check issues:write permission)"
          fi

      - name: Check regression
        if: github.event_name == 'schedule'
        run: |
          # Compare with previous run (if available)
          python3 << 'EOF'
          import json
          from pathlib import Path

          reports = sorted(Path("evals/reports").glob("eval_*.json"))
          if len(reports) < 2:
              print("Not enough reports for regression check")
              exit(0)

          current = json.load(open(reports[-1]))
          previous = json.load(open(reports[-2]))

          current_rate = current.get('passed_tasks', 0) / max(current.get('total_tasks', 1), 1)
          previous_rate = previous.get('passed_tasks', 0) / max(previous.get('total_tasks', 1), 1)

          delta = current_rate - previous_rate

          if delta < -0.1:  # More than 10% regression
              print(f"❌ REGRESSION DETECTED: Pass rate dropped by {abs(delta)*100:.1f}%")
              exit(1)
          elif delta < 0:
              print(f"⚠️ Minor regression: Pass rate dropped by {abs(delta)*100:.1f}%")
          else:
              print(f"✅ No regression: Pass rate {'improved' if delta > 0 else 'stable'}")
          EOF

  # MVP Validation - Run 20x for consistency
  mvp-validation:
    name: MVP Validation (20x)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.runs >= 20
    needs: eval
    steps:
      - uses: actions/checkout@v4

      - name: Download eval reports
        uses: actions/download-artifact@v4
        with:
          name: eval-reports-${{ github.run_number }}
          path: evals/reports/

      - name: Analyze consistency
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path
          from collections import defaultdict

          reports = list(Path("evals/reports").glob("eval_*.json"))
          if not reports:
              print("No reports found")
              exit(1)

          # Aggregate results across all runs
          task_results = defaultdict(lambda: {'passed': 0, 'failed': 0})

          for report_path in reports:
              with open(report_path) as f:
                  report = json.load(f)

              for result in report.get('results', []):
                  task_id = result.get('task_id', 'unknown')
                  if result.get('passed', False):
                      task_results[task_id]['passed'] += 1
                  else:
                      task_results[task_id]['failed'] += 1

          # Calculate consistency
          print("=" * 60)
          print("MVP VALIDATION REPORT")
          print("=" * 60)
          print()

          total_consistency = []
          for task_id, counts in sorted(task_results.items()):
              total = counts['passed'] + counts['failed']
              consistency = counts['passed'] / total if total > 0 else 0
              total_consistency.append(consistency)

              status = "✅" if consistency == 1.0 else "⚠️" if consistency >= 0.8 else "❌"
              print(f"{status} {task_id}: {counts['passed']}/{total} runs passed ({consistency*100:.0f}%)")

          print()
          print("-" * 60)
          avg_consistency = sum(total_consistency) / len(total_consistency) if total_consistency else 0
          print(f"Average Consistency: {avg_consistency*100:.1f}%")

          if avg_consistency >= 0.95:
              print("✅ MVP CRITERIA MET: >95% average consistency")
          else:
              print("❌ MVP CRITERIA NOT MET: <95% average consistency")
              exit(1)
          EOF

  # ---------------------------------------------------------------------------
  # Every numbered claim in README.md, re-measured and compared.
  #
  # `make reproduce-spend-gate` already re-verified the two spend figures and
  # exited non-zero on drift. Nothing re-verified the latency table or the
  # attack/benign rates, so those were hand-typed numbers that could go stale
  # without anything noticing -- and `make bench-enforcement`, the command the
  # README names for reproducing them, had been exiting 101 since the policy
  # crate was renamed.
  #
  # Nightly rather than per-PR: the criterion sweep is six cases at 100 samples
  # after a 3s warm-up, which is more wall-clock than a PR gate should spend.
  # Fully offline though -- no Postgres, no Redis, no model credentials -- so it
  # needs none of the service setup the eval job above does.
  # ---------------------------------------------------------------------------
  readme-figures:
    name: Re-verify published figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-

      - name: Reproduce every published figure
        id: reproduce
        run: |
          set -o pipefail
          make reproduce-readme-figures 2>&1 | tee figures.log

      - name: Upload comparison log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-figures-${{ github.run_number }}
          path: figures.log
          retention-days: 14

      - name: Open/refresh tracking issue on drift
        # Drift is a documentation defect, not a broken build, so it gets a
        # tracking issue rather than only a red square someone has to go
        # looking for. The job still fails: an alert nobody is paged by and a
        # status nobody reads are the same silence in different clothes.
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Published README figures no longer reproduce"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          drift="$(grep -E '^\s*DRIFT' figures.log | head -20 || true)"
          body="The nightly figure check found drift ($(date -u +%Y-%m-%dT%H:%MZ)). Run: ${run_url}

          \`\`\`
          ${drift:-See the readme-figures-${{ github.run_number }} artifact for the full comparison.}
          \`\`\`

          Latency rows are compared within a stated band on a stated machine, so a
          drift row there means the figure moved well beyond run-to-run noise, not
          that the runner was busy. Rate rows are exact: those benchmarks are
          deterministic, seeded and offline, so any change is a behaviour change.

          Either the change is a regression, or the figure moved legitimately — in
          which case README.md, docs/benchmarks/enforcement-latency.md and the
          tables at the top of scripts/check_readme_figures.py should be updated in
          the same commit. Reproduce locally with \`make reproduce-readme-figures\`."
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" && echo "Refreshed tracking issue #${existing}"
          else
            gh issue create --title "$title" --body "$body" \
              && echo "Opened tracking issue" \
              || echo "::warning::could not open tracking issue (check issues:write permission)"
          fi
