name: Evaluations

# This workflow runs the NIGHTLY, LLM-judged evaluation suite (the smoke /
# regression / all suites, which need model calls and a live stack). The
# DETERMINISTIC governance suites — injection-defense, ASB, and
# governed-vs-ungoverned, plus the real `fd_policy` engine pins — are gated on
# every push + PR by the `eval-regression` job in ci.yml (no services, no
# secrets), so a fixture/pin regression blocks a merge without waiting for the
# nightly run. Keep that split: fast + deterministic on PRs here-in-ci, slow +
# LLM-judged on a schedule here. See ROADMAP #7.
on:
  # Run on schedule (daily at 2 AM UTC)
  schedule:
    - cron: '0 2 * * *'

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      suite:
        description: 'Evaluation suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - all

      runs:
        description: 'Number of runs per task (for consistency check)'
        required: false
        default: '1'
        type: string

      parallel:
        description: 'Number of parallel workers'
        required: false
        default: '2'
        type: string

env:
  CARGO_TERM_COLOR: always

# Least privilege: read the repo, and open/refresh a single tracking issue when a
# scheduled run fails, so a red cron is never silent (the failure that cost three
# days to diagnose). No write access to repo contents.
permissions:
  contents: read
  issues: write

jobs:
  eval:
    name: Run Evaluations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ferrumdeck
          POSTGRES_PASSWORD: ferrumdeck
          POSTGRES_DB: ferrumdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Preflight — required secrets
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            {
              echo "## ❌ ANTHROPIC_API_KEY is not set — cannot run the LLM-judged evals"
              echo ""
              echo "This is a **configuration** problem, not a code bug. Set the secret at"
              echo "**Settings → Secrets and variables → Actions → ANTHROPIC_API_KEY**."
              echo "A tracking issue is opened/updated by this run on a scheduled failure."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error title=Missing ANTHROPIC_API_KEY::Config issue, not code — set the ANTHROPIC_API_KEY repo secret."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY is present."

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build gateway
        run: cargo build --package gateway --release

      - name: Start gateway
        env:
          DATABASE_URL: postgres://ferrumdeck:ferrumdeck@localhost:5432/ferrumdeck
          REDIS_URL: redis://localhost:6379
          GATEWAY_PORT: 8080
          RUST_LOG: info
          # The eval harness drives the gateway hard: parallel workers poll run +
          # step status once a second (DEFAULT_POLL_INTERVAL=1.0s) on a single
          # tenant, which blows past the default 100/min per-tenant limit and 429s
          # (the 401 auth bug had masked this — no request ever reached the
          # limiter). CI gets a generous limit, exactly as compose.dev raises it for
          # dev; production keeps the defaults.
          RATE_LIMIT_PER_MINUTE: "100000"
          PRE_AUTH_RATE_LIMIT_PER_MINUTE: "10000"
        run: |
          ./target/release/gateway &
          sleep 5
          curl -f http://localhost:8080/health

      - name: Start worker
        env:
          FD_CONTROL_PLANE_URL: http://localhost:8080
          REDIS_URL: redis://localhost:6379
          # The worker reports step results back to the gateway and must
          # authenticate; without FD_API_KEY it logs "cannot report results to
          # control plane" and the run never completes. Seeded dev key.
          FD_API_KEY: fd_dev_key_abc123
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run python -m fd_worker &
          sleep 3

      - name: Run evaluations
        id: run_evals
        env:
          FD_CONTROL_PLANE_URL: http://localhost:8080
          # ROOT CAUSE of the nightly going red: the runner sends
          # `Authorization: Bearer $FD_API_KEY` only when FD_API_KEY is set
          # (fd_evals/runner.py). Unset, it sent no header and the gateway 401'd
          # POST /v1/runs with "Missing Authorization header". This seeded dev key
          # is accepted (legacy-hash deadline is 2027-01-01, not passed).
          FD_API_KEY: fd_dev_key_abc123
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          SUITE="${{ inputs.suite || 'smoke' }}"
          RUNS="${{ inputs.runs || '1' }}"
          PARALLEL="${{ inputs.parallel || '2' }}"
          # Export the suite so the failure-explainer step can name it.
          echo "EVAL_SUITE=$SUITE" >> "$GITHUB_ENV"

          echo "Running eval suite: $SUITE  (runs=$RUNS, parallel=$PARALLEL)"
          mkdir -p evals/reports
          # Tee the whole run to a log so a failure still leaves an artifact that
          # names which case broke (pipefail keeps the eval's exit code).
          uv run python -m fd_evals run \
            --suite "$SUITE" \
            --runs "$RUNS" \
            --parallel "$PARALLEL" \
            --output "evals/reports/eval_${SUITE}_$(date +%Y%m%d_%H%M%S).json" \
            2>&1 | tee "evals/reports/eval-output-${SUITE}.log"

      - name: Explain failure (which suite + which case)
        if: failure() && steps.run_evals.conclusion == 'failure'
        run: |
          log="evals/reports/eval-output-${EVAL_SUITE:-smoke}.log"
          {
            echo "## ❌ Nightly eval run failed"
            echo ""
            echo "**Suite:** \`${EVAL_SUITE:-unknown}\`"
            echo ""
            if [ -f "$log" ]; then
              echo "**Failing cases / first errors:**"
              echo '```'
              grep -E "Task .* failed:|ControlPlaneError|UNAUTHORIZED|Missing Authorization|[0-9]{3} (Unauthorized|Forbidden)|Traceback|Error:" "$log" | head -30 || echo "(no per-case failure lines captured)"
              echo '```'
              echo ""
              echo "Full output + any partial report are in the **eval-reports-${{ github.run_number }}** artifact."
            else
              echo "The run failed before producing eval output (see the step logs above)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate summary
        run: |
          python3 << 'EOF'
          import json
          import os
          from pathlib import Path

          reports_dir = Path("evals/reports")
          latest = sorted(reports_dir.glob("eval_*.json"))[-1] if reports_dir.exists() else None

          if not latest:
              print("No eval reports found")
              exit(0)

          with open(latest) as f:
              report = json.load(f)

          total = report.get('total_tasks', 0)
          passed = report.get('passed_tasks', 0)
          failed = total - passed
          duration = report.get('duration_seconds', 0)

          summary = f"""
          ## Evaluation Results

          | Metric | Value |
          |--------|-------|
          | Suite | {report.get('suite', 'unknown')} |
          | Total Tasks | {total} |
          | Passed | {passed} |
          | Failed | {failed} |
          | Pass Rate | {100*passed/total:.1f}% |
          | Duration | {duration:.1f}s |

          """

          # Write to GitHub summary
          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
              f.write(summary)

          print(summary)
          EOF

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-${{ github.run_number }}
          path: evals/reports/
          retention-days: 90

      - name: Open/refresh tracking issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly eval workflow is failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The scheduled \`Evaluations\` workflow failed ($(date -u +%Y-%m-%dT%H:%MZ)). Run: ${run_url}

          The eval report and full output are attached as the \`eval-reports-${{ github.run_number }}\` artifact, and the run summary names the failing suite/case. If the preflight flagged a missing ANTHROPIC_API_KEY this is a config issue (set the secret); otherwise it is a code/stack failure to investigate."
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" && echo "Refreshed tracking issue #${existing}"
          else
            gh issue create --title "$title" --body "$body" \
              && echo "Opened tracking issue" \
              || echo "::warning::could not open tracking issue (check issues:write permission)"
          fi

      - name: Check regression
        if: github.event_name == 'schedule'
        run: |
          # Compare with previous run (if available)
          python3 << 'EOF'
          import json
          from pathlib import Path

          reports = sorted(Path("evals/reports").glob("eval_*.json"))
          if len(reports) < 2:
              print("Not enough reports for regression check")
              exit(0)

          current = json.load(open(reports[-1]))
          previous = json.load(open(reports[-2]))

          current_rate = current.get('passed_tasks', 0) / max(current.get('total_tasks', 1), 1)
          previous_rate = previous.get('passed_tasks', 0) / max(previous.get('total_tasks', 1), 1)

          delta = current_rate - previous_rate

          if delta < -0.1:  # More than 10% regression
              print(f"❌ REGRESSION DETECTED: Pass rate dropped by {abs(delta)*100:.1f}%")
              exit(1)
          elif delta < 0:
              print(f"⚠️ Minor regression: Pass rate dropped by {abs(delta)*100:.1f}%")
          else:
              print(f"✅ No regression: Pass rate {'improved' if delta > 0 else 'stable'}")
          EOF

  # MVP Validation - Run 20x for consistency
  mvp-validation:
    name: MVP Validation (20x)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.runs >= 20
    needs: eval
    steps:
      - uses: actions/checkout@v4

      - name: Download eval reports
        uses: actions/download-artifact@v4
        with:
          name: eval-reports-${{ github.run_number }}
          path: evals/reports/

      - name: Analyze consistency
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path
          from collections import defaultdict

          reports = list(Path("evals/reports").glob("eval_*.json"))
          if not reports:
              print("No reports found")
              exit(1)

          # Aggregate results across all runs
          task_results = defaultdict(lambda: {'passed': 0, 'failed': 0})

          for report_path in reports:
              with open(report_path) as f:
                  report = json.load(f)

              for result in report.get('results', []):
                  task_id = result.get('task_id', 'unknown')
                  if result.get('passed', False):
                      task_results[task_id]['passed'] += 1
                  else:
                      task_results[task_id]['failed'] += 1

          # Calculate consistency
          print("=" * 60)
          print("MVP VALIDATION REPORT")
          print("=" * 60)
          print()

          total_consistency = []
          for task_id, counts in sorted(task_results.items()):
              total = counts['passed'] + counts['failed']
              consistency = counts['passed'] / total if total > 0 else 0
              total_consistency.append(consistency)

              status = "✅" if consistency == 1.0 else "⚠️" if consistency >= 0.8 else "❌"
              print(f"{status} {task_id}: {counts['passed']}/{total} runs passed ({consistency*100:.0f}%)")

          print()
          print("-" * 60)
          avg_consistency = sum(total_consistency) / len(total_consistency) if total_consistency else 0
          print(f"Average Consistency: {avg_consistency*100:.1f}%")

          if avg_consistency >= 0.95:
              print("✅ MVP CRITERIA MET: >95% average consistency")
          else:
              print("❌ MVP CRITERIA NOT MET: <95% average consistency")
              exit(1)
          EOF
