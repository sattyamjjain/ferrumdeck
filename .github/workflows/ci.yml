name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual trigger. Added after a push to main on 2026-09-01 created no run at
  # all -- Actions reported operational, the repo was public with Actions
  # enabled and the CI workflow active, and the push event simply never
  # produced one. Without a dispatch trigger there was no way to start CI for
  # that commit short of pushing another one. A gate you cannot run on demand is
  # a gate you cannot confirm ran, which is the failure this repo keeps finding
  # in other forms.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # =============================================================================
  # Rust Jobs
  # =============================================================================
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: rust-check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ferrumdeck
          POSTGRES_PASSWORD: ferrumdeck
          POSTGRES_DB: ferrumdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        env:
          DATABASE_URL: postgres://ferrumdeck:ferrumdeck@localhost:5432/ferrumdeck
          REDIS_URL: redis://localhost:6379
        run: cargo test --workspace -- --test-threads=4

      - name: Generate test summary
        if: always()
        run: |
          echo "## Rust Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Crate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| fd-audit | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| fd-core | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| fd-dag | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| fd-otel | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| fd-policy | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| fd-storage | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| gateway | ✅ |" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Python Jobs
  # =============================================================================
  python-check:
    name: Python Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run ruff check
        run: uv run ruff check python/

      - name: Run ruff format check
        run: uv run ruff format --check python/

      - name: Run pyright
        run: uv run pyright python/

      - name: Claims integrity (README Key Features vs Limitations vs ROADMAP)
        run: uv run python scripts/check_claims_integrity.py

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: python-check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ferrumdeck
          POSTGRES_PASSWORD: ferrumdeck
          POSTGRES_DB: ferrumdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Assert the unit-test collection did not shrink
        run: |
          # A guard that is not collected is not a guard, and nothing said so.
          # tests/*.py matched no CI path for months: 18 regression guards passed
          # locally and were skipped here while "Python Tests" went green. The fix
          # was to add the glob; this is the gate that makes the next instance
          # fail instead of going quiet.
          #
          # Two assertions, because they catch different mistakes:
          #   - every root must yield at least one test, which catches a path
          #     being renamed, moved, or dropped from the list outright;
          #   - the total must clear a floor, which catches a root that still
          #     resolves but stops matching most of what it used to.
          #
          # FLOOR is deliberately below the current count. It is a cliff detector,
          # not a ratchet: the failure being guarded removes tens of tests at once,
          # so a floor that tracked the exact count would only generate churn.
          # Note: no `set -e`. A grep that matches nothing exits non-zero, which
          # under -e kills this step before it can report which root was empty --
          # a gate that dies silently being precisely the thing being fixed.
          set -uo pipefail
          FLOOR=520

          # pytest pads its summary with '=' ("==== 114 tests collected ===="),
          # so match the phrase anywhere on the line rather than anchoring to
          # the start. grep -oE is portable across BSD and GNU.
          count() {
            uv run pytest "$@" --collect-only -q 2>/dev/null \
              | grep -oE '[0-9]+ tests? collected' | tail -1 \
              | grep -oE '^[0-9]+' || echo 0
          }

          total=0
          rc=0
          check() {  # check <label> <count>
            printf '  %5s  %s\n' "$2" "$1"
            if [ "$2" -eq 0 ]; then
              echo "::error::Collection root '$1' yielded 0 tests. It was renamed, moved, or no longer matches anything -- and the suite would still have gone green." >&2
              rc=1
            fi
          }

          for root in python/packages/fd-runtime/tests \
                      python/packages/fd-mcp-router/tests \
                      python/packages/fd-worker/tests \
                      python/packages/fd-evals/tests; do
            n=$(count "$root")
            check "$root" "$n"
            total=$((total + n))
          done

          # The root-level glob is counted as ONE group, exactly as the test step
          # below passes it. Iterating its expansion instead would trip over
          # tests/__init__.py, which correctly contains no tests.
          n=$(count tests/*.py)
          check 'tests/*.py' "$n"
          total=$((total + n))

          echo "collected $total tests across all roots (floor $FLOOR)"
          if [ "$total" -lt "$FLOOR" ]; then
            echo "::error::Collected $total tests, below the floor of $FLOOR. A collection path has stopped matching. Investigate before lowering this number." >&2
            rc=1
          fi
          exit $rc

      - name: Assert every declared eval suite is reachable from a workflow
        run: |
          # Third instance of the same class: `regression` was declared in
          # evals/suites/ for months while the nightly cron only ever ran
          # `smoke`, so it never executed and docs/eval-health.md reported
          # NEVER RUN while the project claimed eval gating. Adding a second
          # cron fixed the instance; this fails the build on the next one.
          #
          # In this job rather than a lint job, and a prerequisite of `ci-check`,
          # following the eval-health-check precedent -- a gate someone can skip
          # is a lint.
          uv run python scripts/check_suite_reachability.py

      - name: Assert no declared eval has zero committed reports, and none has gone stale
        run: |
          # The other half of "declared but never executed": a suite that is
          # reachable but whose first run has never been committed. That used to
          # render as a NEVER RUN row, which is documentation of a problem rather
          # than a gate on it. gen_eval_health.py now exits non-zero instead.
          #
          # `--release` adds the third variant of the same class, and the one
          # that had actually shipped: an eval that runs, passes, and whose
          # EVIDENCE is sixteen days old. The page called that "pass". It now
          # calls it STALE and this fails.
          #
          # Note the failure this can produce on an unrelated PR: staleness is a
          # function of the clock, so once the limit is crossed every build goes
          # red until someone re-runs the evals. That is intended --- it is a
          # claim about the README's security numbers, not about the PR --- and
          # the message says so rather than telling you to regenerate the page.
          uv run python scripts/gen_eval_health.py --check --release

      - name: Assert the eval measurement series was appended to, not rewritten
        run: |
          # Fifth surface of the same class, and the one with the longest half
          # life. docs/eval-health.md is a snapshot: every refresh overwrites
          # yesterday's answer, so a number that has held steady for a month and
          # one that has never been re-measured render identically. The record
          # that separates them is docs/eval-health-series.jsonl, and it is only
          # worth having if a past row cannot change.
          #
          # A correction is an APPENDED row carrying `correction_of` and
          # `reason`. The wrong row stays: that it was published is part of the
          # record, and an evidence file that can be edited after the fact is
          # not evidence.
          uv run python scripts/gen_eval_health.py --check-series

      - name: Assert no route serves plausible data without a backend
        run: |
          # Fourth and last surface of the same class. An eval that never runs, a
          # test CI never collects, a suite no workflow triggers -- and a route
          # that answers 200 without asking anything. Issue #7 named this one:
          # /api/v1/evals/* was BFF-stubbed, so the dashboard rendered a shape
          # that had never touched the control plane.
          #
          # The invariant is the one both planes already follow: an unimplemented
          # route returns 501 with an issue link, never an empty 200. `200
          # {"suites": []}` reads as "we looked and found none"; 501 says "we
          # never looked", which is the true statement.
          uv run python scripts/check_route_backing.py

      - name: Run unit tests
        env:
          DATABASE_URL: postgres://ferrumdeck:ferrumdeck@localhost:5432/ferrumdeck
          REDIS_URL: redis://localhost:6379
        run: |
          # tests/*.py at the repo root cover the generated-doc tooling
          # (scripts/gen_eval_health.py, observability/genai_mapping.py) which
          # lives outside python/packages. They were previously collected by no
          # CI path at all -- tests/api, tests/integration and tests/security are
          # each named explicitly -- so those regression guards passed locally and
          # were silently skipped here. Listed by glob so a new root test file is
          # picked up automatically rather than needing this line edited again.
          #
          # The step above asserts this exact set of roots still collects.
          uv run pytest python/packages/fd-runtime/tests \
                        python/packages/fd-mcp-router/tests \
                        python/packages/fd-worker/tests \
                        python/packages/fd-evals/tests \
                        tests/*.py \
                        -v --tb=short --junitxml=pytest-unit-results.xml

      - name: Run API contract tests
        run: |
          uv run pytest tests/api -v --tb=short --junitxml=pytest-api-results.xml

      - name: Run integration tests (if services available)
        env:
          DATABASE_URL: postgres://ferrumdeck:ferrumdeck@localhost:5432/ferrumdeck
          REDIS_URL: redis://localhost:6379
        run: |
          uv run pytest tests/integration tests/security -v --tb=short \
            --junitxml=pytest-integration-results.xml || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: pytest-*.xml
          retention-days: 7

      - name: Generate test summary
        if: always()
        run: |
          echo "## Python Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Tests |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| fd-runtime | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| fd-mcp-router | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| fd-worker | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| fd-evals | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| API Contracts | ✅ |" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Next.js Jobs
  # =============================================================================
  nextjs-check:
    name: Next.js Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  nextjs-test:
    name: Next.js Tests
    runs-on: ubuntu-latest
    needs: nextjs-check
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npm test -- --coverage --watchAll=false --ci --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./test-results
          JEST_JUNIT_OUTPUT_NAME: junit.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: nextjs/test-results/
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: nextjs/coverage/
          retention-days: 7

      - name: Generate test summary
        if: always()
        run: |
          echo "## Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            node -e "
              const cov = require('./coverage/coverage-summary.json');
              const total = cov.total;
              console.log('| Metric | Coverage |');
              console.log('|--------|----------|');
              console.log('| Statements | ' + total.statements.pct + '% |');
              console.log('| Branches | ' + total.branches.pct + '% |');
              console.log('| Functions | ' + total.functions.pct + '% |');
              console.log('| Lines | ' + total.lines.pct + '% |');
            " >> $GITHUB_STEP_SUMMARY
          fi

  nextjs-build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: nextjs-test
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: nextjs/.next
          retention-days: 7

  nextjs-docker:
    name: Next.js Docker Build
    runs-on: ubuntu-latest
    needs: nextjs-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./nextjs
          push: false
          tags: ferrumdeck-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Contract Validation & API Tests
  # =============================================================================
  contracts:
    name: Validate Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate OpenAPI spec
        run: npx --yes @redocly/cli lint contracts/openapi/control-plane.openapi.yaml --skip-rule=no-unused-components

      - name: Validate JSON schemas
        run: |
          for schema in contracts/jsonschema/*.json; do
            echo "Validating: $schema"
            python3 -c "import json; json.load(open('$schema'))"
          done

  api-contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run API contract tests
        run: |
          uv run pytest tests/api -v --tb=short --junitxml=api-contract-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-contract-results
          path: api-contract-results.xml
          retention-days: 7

      - name: Generate test summary
        if: always()
        run: |
          echo "## API Contract Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Schema Validation (API-VAL) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Contract Consistency (API-CON) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Backwards Compatibility (API-BWD) | ✅ |" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Live-stack tests — issue #6.
  #
  # tests/security, tests/chaos and tests/e2e reported "135 collected, 135
  # skipped, 0 run". chaos and e2e appeared in NO workflow at all; security ran
  # only inside a `|| true` step in python-test, with no gateway behind it. All
  # three were green and none had asserted anything.
  #
  # This job stands a real stack up and gates on tests that actually EXECUTED.
  # `scripts/check_live_stack_results.py` fails on: executed below the floor (a
  # cliff detector, same shape as the collection floor in python-test), any
  # undeclared failure, and any declared failure that has started passing. The
  # exemptions live in `.live-stack-known-failures.yml` and each carries a real
  # diagnosis -- that is the difference between this and `|| true`.
  #
  # No ANTHROPIC_API_KEY and no worker: the LLM-backed agent scenarios are
  # declared in that file rather than pretended at. This job asserts the
  # enforcement surface, which needs neither.
  # =============================================================================
  live-stack-tests:
    name: Live-Stack Tests
    runs-on: ubuntu-latest
    needs: rust-check
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ferrumdeck
          POSTGRES_PASSWORD: ferrumdeck
          POSTGRES_DB: ferrumdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://ferrumdeck:ferrumdeck@localhost:5432/ferrumdeck
      REDIS_URL: redis://localhost:6379
      GATEWAY_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-livestack-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Build the gateway
        run: cargo build -p gateway

      - name: Boot the gateway (migrations + dev seed run on startup)
        run: |
          # Dev rate limits: several security tests make bursts, and the
          # production default would rate-limit them into false failures.
          RUST_LOG=warn \
          RATE_LIMIT_PER_MINUTE=1000 \
          PRE_AUTH_RATE_LIMIT_PER_MINUTE=500 \
          GATEWAY_PORT=8080 \
            ./target/debug/gateway > /tmp/gateway.log 2>&1 &
          echo $! > /tmp/gateway.pid

      - name: Wait for the gateway to be ready
        run: |
          # The readiness probe is the thing that broke last time: the suites
          # polled /health/live, which the gateway does not serve, so they
          # skipped unconditionally against a healthy stack. Probe the route
          # that actually exists, and fail loudly rather than proceeding to a
          # skipped run.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "gateway ready after ${i}s"
              curl -fsS http://localhost:8080/ready || true
              exit 0
            fi
            sleep 1
          done
          echo "::error title=Gateway never became ready::/health did not answer within 60s"
          cat /tmp/gateway.log
          exit 1

      - name: Run the Rust integration tests against the migrated schema
        # `cargo test --workspace` in the rust-test job does NOT cover these.
        # All four are `#[ignore]`d because they need a real Postgres, and until
        # now NOTHING in CI ran `--ignored` -- `make test-integration` is the
        # only caller and no workflow invokes it. So
        # `permission_reconstruction.rs`, which asserts the invariant this whole
        # job family exists to establish (an investigator can answer "what was
        # this identity permitted to do at time T" from the log alone), had
        # never once executed in CI. That is the exact defect class the checker
        # below gates for pytest; it applied to the Rust side too.
        #
        # Ordering matters: the schema comes from the migrations the gateway
        # runs at startup, so this has to follow the readiness wait above.
        run: |
          set -o pipefail
          cargo test --workspace --lib --tests -- --ignored 2>&1 | tee /tmp/rust-integration.log

          # Exit 0 is not evidence of execution. Each of these tests returns
          # early (passing) when DATABASE_URL is unset, so a misconfigured job
          # would go green having asserted nothing -- the same vacuous pass the
          # eval harness was caught doing. Assert each one reported by name.
          for t in permissions_are_reconstructable_from_the_log_alone_across_a_policy_change \
                   a_recorded_policy_document_cannot_be_rewritten_under_its_hash \
                   migrations::tests::log_migration_status_succeeds_against_a_migrated_database \
                   migrations::tests::migrations_checksum_column_is_bytea; do
            if ! grep -qF "test $t ... ok" /tmp/rust-integration.log; then
              echo "::error title=Integration test did not execute::$t did not report a pass. A test that silently skips its precondition is indistinguishable from one that passed."
              exit 1
            fi
          done
          echo "OK -- 4 Rust integration tests executed against the migrated schema."

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run the live-stack suites
        # Not `|| true`, and not a bare pytest either: pytest's exit code is
        # non-zero for the declared failures, so the verdict belongs to the
        # checker below, which knows which failures are declared.
        run: |
          uv run pytest tests/security tests/chaos tests/e2e \
            -v --tb=short --junitxml=live-stack-results.xml || true

      - name: Assert the suites actually executed, and only known failures failed
        run: uv run python scripts/check_live_stack_results.py --junit live-stack-results.xml

      - name: Gateway log (on failure)
        if: failure()
        run: tail -200 /tmp/gateway.log || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-stack-results
          path: live-stack-results.xml
          retention-days: 7

      - name: Stop the gateway
        if: always()
        run: kill "$(cat /tmp/gateway.pid)" 2>/dev/null || true

  # =============================================================================
  # Deterministic governance regression gate — runs on EVERY push + PR (the
  # workflow's push/pull_request triggers), with NO services and NO secrets.
  # It fails the build the moment a golden fixture or a real-engine pin
  # disagrees: the injection-defense / ASB / governed-vs-ungoverned eval numbers
  # the README cites, and the `fd_policy` engine tests that pin them (plus the
  # AP2 signed-Mandate gate). These are pure, offline, and LLM-free, so they gate
  # a PR merge deterministically. The LLM-judged smoke suite stays nightly in
  # evals.yml (#7).
  # =============================================================================
  eval-regression:
    name: Governance Regression Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-eval-regression-${{ hashFiles('**/Cargo.lock') }}

      # Deterministic, offline eval numbers the README cites (no LLM, no network).
      - name: Governance eval suites (injection-defense, ASB, governed-vs-ungoverned)
        run: make eval-injection-defense && make eval-asb && make bench-governed

      # The real fd_policy engine tests that pin those same numbers + the AP2
      # signed-Mandate gate. (Crate published as `ferrumdeck-policy`.)
      - name: Real-engine governance pins
        run: >-
          cargo test -p ferrumdeck-policy
          --test injection_defense
          --test asb_defense
          --test governed_benchmark
          --test ap2_gate

  # =============================================================================
  # Eval Gate (on PRs to main)
  # =============================================================================
  eval-gate:
    name: Evaluation Gate
    runs-on: ubuntu-latest
    needs: [rust-test, python-test, nextjs-test, api-contract-tests]
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ferrumdeck
          POSTGRES_PASSWORD: ferrumdeck
          POSTGRES_DB: ferrumdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferrumdeck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build gateway
        run: cargo build --package gateway

      - name: Start gateway
        env:
          DATABASE_URL: postgres://ferrumdeck:ferrumdeck@localhost:5432/ferrumdeck
          REDIS_URL: redis://localhost:6379
          GATEWAY_PORT: 8080
          RUST_BACKTRACE: 1
        run: |
          cargo run --package gateway > gateway.log 2>&1 &
          GATEWAY_PID=$!
          echo "Gateway PID: $GATEWAY_PID"

          # Wait for gateway to be ready (up to 30 seconds)
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Gateway is ready!"
              exit 0
            fi
            # Check if process is still running
            if ! kill -0 $GATEWAY_PID 2>/dev/null; then
              echo "Gateway crashed! Logs:"
              cat gateway.log
              exit 1
            fi
            echo "Waiting for gateway... ($i/30)"
            sleep 1
          done

          echo "Gateway failed to start in time. Logs:"
          cat gateway.log
          exit 1

      - name: Run smoke tests
        env:
          FD_CONTROL_PLANE_URL: http://localhost:8080
          FD_API_KEY: fd_dev_key_abc123
          DATABASE_URL: postgres://ferrumdeck:ferrumdeck@localhost:5432/ferrumdeck
          REDIS_URL: redis://localhost:6379
        run: |
          uv run python -m fd_evals run \
            --suite smoke \
            --output evals/reports/smoke_ci.json \
            --parallel 1 \
            --mock

      - name: Check eval results
        run: |
          python3 << 'EOF'
          import json
          import sys

          with open('evals/reports/smoke_ci.json') as f:
              report = json.load(f)

          total = report.get('total_tasks', 0)
          passed = report.get('passed_tasks', 0)
          pass_rate = (passed / total * 100) if total > 0 else 0

          print(f"Eval Results: {passed}/{total} passed ({pass_rate:.1f}%)")

          # Fail if pass rate < 80%
          if pass_rate < 80:
              print("❌ Eval gate FAILED: Pass rate below 80%")
              sys.exit(1)
          else:
              print("✅ Eval gate PASSED")
          EOF

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/
          retention-days: 30

  # =============================================================================
  # Test Summary
  # =============================================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [rust-test, python-test, nextjs-test, api-contract-tests, live-stack-tests]
    if: always()
    steps:
      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-results
          pattern: "*-test-results|*-coverage|api-contract-results|eval-report"
          merge-multiple: true

      - name: Generate comprehensive summary
        run: |
          echo "# 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Suite Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Tests | ${{ needs.rust-test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Tests | ${{ needs.python-test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.nextjs-test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Contract Tests | ${{ needs.api-contract-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Live-Stack Tests | ${{ needs.live-stack-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Expected Test Counts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Tests |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust (7 crates) | ~412 |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Unit | ~280 |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ~561 |" >> $GITHUB_STEP_SUMMARY
          echo "| API Contracts | ~50 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **~1,303** |" >> $GITHUB_STEP_SUMMARY

      - name: Check all tests passed
        if: needs.rust-test.result != 'success' || needs.python-test.result != 'success' || needs.nextjs-test.result != 'success' || needs.api-contract-tests.result != 'success'
        run: |
          echo "❌ One or more test suites failed"
          exit 1

  # =============================================================================
  # Security Scan
  # =============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo audit
        run: |
          cargo install cargo-audit || true
          cargo audit || echo "::warning::Security vulnerabilities found"

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
