name: Publish Images

# Builds the gateway + worker container images multi-arch (amd64 + arm64, so an
# Apple-silicon reviewer can pull natively) and pushes them to GHCR on a version
# tag. This is what lets a stranger run the demo with `docker compose` and no Rust,
# Node, or make toolchain (see QUICKSTART.md). Base images are digest-pinned in the
# Dockerfiles. `workflow_dispatch` builds a sha-tagged image for testing without a
# tag. After the first push the packages must be made PUBLIC (once), or an
# anonymous `docker pull` fails — see QUICKSTART / the PR notes.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ferrumdeck-gateway
            dockerfile: deploy/docker/Dockerfile.gateway
          - image: ferrumdeck-worker
            dockerfile: deploy/docker/Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
          # Links the package to this repo so it inherits the source, and so
          # `make public` applies to the right package.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=FerrumDeck ${{ matrix.image }}

      - name: Build & push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
